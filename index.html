<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="musu競馬">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<title>musu 競馬予想</title>
<style>/*paper*/
:root{--bg:#fff;--card:#fff;--text:#111;--sub:#6b6b6b;--line:#dadada;--accent:#111;--accent2:#f3f3f3;--buy:#c8102e;--buybg:#fff6f6;--hit:#c8102e;--miss:#9b9b9b;--inv:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#141414;--text:#ececec;--sub:#9c9c9c;--line:#333;--accent:#ececec;--accent2:#1e1e1e;--buy:#ff6b7d;--buybg:#2a1719;--hit:#ff6b7d;--miss:#777;--inv:#141414}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;font-feature-settings:"palt"}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;border-bottom:1px solid #000}
header h1{margin:0;font-size:14px;font-weight:800;letter-spacing:.08em;display:inline}
header .meta{font-size:11px;opacity:.75;display:inline;margin-left:8px;font-variant-numeric:tabular-nums}
.src{display:flex;gap:0;margin-top:5px}.src button{border:1px solid #555;border-right:0;background:transparent;color:#bbb;border-radius:0;padding:3px 12px;font-size:12px;font-family:inherit}
.src button:nth-of-type(2){border-right:1px solid #555}.src button.on{background:#fff;color:#111;font-weight:800;border-color:#fff}
.src .sosb{margin-left:auto;border:1px solid #555;background:transparent;color:#bbb;font-weight:400}
#sos{margin:8px 12px 0;padding:10px 0;border-top:2px solid var(--buy);font-size:13px;line-height:1.5}
#sos .it{padding:5px 0;border-top:1px solid var(--line)}#sos .ng{color:var(--buy);font-weight:700}#sos .ok{color:var(--text)}#sos .x{float:right;border:0;background:none;color:var(--sub);font-size:18px}
main{padding:6px 12px calc(64px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:2px solid var(--text);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:13px;padding:12px 0;font-family:inherit}
nav button .ic{display:none}
nav button.on{color:var(--text);font-weight:800;box-shadow:inset 0 3px 0 var(--text)}
.card{background:transparent;border:0;border-top:2px solid var(--text);border-radius:0;padding:8px 0 4px;margin:0 0 16px}
.race-title{font-size:19px;font-weight:800;margin:0;letter-spacing:.02em}
.sub{color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.count{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.badge{display:inline-block;font-size:12px;font-weight:400;padding:0;border-radius:0;background:none;color:var(--sub);white-space:nowrap;border:0}
.badge.buy{color:var(--text);font-weight:800}
.badge.hit{color:var(--hit);background:none;font-weight:800}
.badge.miss{color:var(--miss);background:none;border:0}
.buy-box{background:transparent;border-top:1px solid var(--text);border-radius:0;padding:6px 0 0;margin-top:10px}
.buy-box h3{margin:0 0 2px;font-size:12px;color:var(--text);font-weight:800}
.horse{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.horse:first-of-type{border-top:0}
.num{flex:0 0 30px;height:30px;border-radius:0;background:var(--text);color:var(--inv);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.buy-box .num{background:var(--buy);color:#fff}
.hname{font-size:15px;font-weight:700}
.right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:19px;font-weight:800}
.none{padding:12px 0;text-align:center;color:var(--sub);border-top:1px solid var(--line);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-top:1px solid var(--line);text-align:right}
th{color:var(--sub);font-weight:400;font-size:11px;border-top:1px solid var(--text)}
td:first-child,th:first-child{text-align:left}
.chips{display:flex;gap:0;overflow-x:auto;margin:6px 0 10px;border-bottom:1px solid var(--text)}
.chips button{border:0;background:none;color:var(--sub);border-radius:0;padding:7px 12px;font-size:14px;white-space:nowrap;font-family:inherit}
.chips button.on{color:var(--text);font-weight:800;box-shadow:inset 0 -3px 0 var(--text);background:none}
.modebar{display:flex;align-items:center;gap:0;margin:2px 0 6px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.modebar button{border:1px solid var(--line);background:none;color:var(--sub);border-radius:0;padding:2px 9px;font-size:11px;font-family:inherit;margin-left:-1px}
.modebar button:first-of-type{margin-left:6px}
.modebar button.on{background:var(--text);border-color:var(--text);color:var(--inv);font-weight:700}
.line{margin-top:8px;padding:2px 0 2px 8px;border-left:3px solid var(--text);border-radius:0;background:none;font-size:13px;line-height:1.5}
.line.mute{border-left-color:var(--line);color:var(--sub)}
.sec{margin-top:8px;border:0;border-top:1px solid var(--line);border-radius:0;padding:0}
.sec>summary{padding:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.sec>summary b{font-weight:800}
.info>summary{color:var(--sub);font-size:11px;padding:5px 0}
.legend{display:none !important}
.lab{display:inline-block;background:var(--text);color:var(--inv);font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;margin-right:6px;letter-spacing:.06em;vertical-align:1px}
.hm{color:var(--hit);font-weight:800}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rrow-wrap:first-child .rrow{border-top:0}
.rno{flex:0 0 38px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.rmid{flex:1;min-width:0}
.rmid .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
.kpi div{background:none;border-top:1px solid var(--line);border-radius:0;padding:6px 0}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--sub)}
.note{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}
table.sim{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
table.sim th,table.sim td{padding:3px 2px;border-bottom:1px solid var(--line);border-top:0;text-align:right;white-space:nowrap}
table.sim th{color:var(--sub);font-weight:400;border-bottom:1px solid var(--text)}
.sample{background:none;color:var(--sub);font-size:11px;font-weight:400;padding:4px 12px;border-bottom:1px solid var(--line)}
dl.leg{margin:0;font-size:12px;line-height:1.55}dl.leg dt{font-weight:800;margin-top:6px}dl.leg dd{margin:0;color:var(--sub)}
/*hud*/
.sk{display:inline-block;font-size:10px;font-weight:400;color:var(--sub);border:1px solid var(--sub);padding:0 4px;margin-left:5px;line-height:1.4;vertical-align:1px;letter-spacing:.05em}
.src .skinb{border:1px solid #555;background:transparent;color:#bbb;margin-left:6px;font-weight:400}
#hudfx{display:none}
html[data-skin=hud]{--bg:#05080f;--card:rgba(12,22,38,.66);--text:#e6f2ff;--sub:#7f97b4;--line:rgba(96,180,255,.20);--accent:#38e1ff;--accent2:rgba(56,225,255,.07);--buy:#38e1ff;--buybg:rgba(56,225,255,.10);--hit:#ff4fd8;--miss:#5a6c84;--inv:#05080f;--neon:#38e1ff;--par:0px}
html[data-skin=hud] body{background:radial-gradient(900px 520px at 80% -8%,rgba(40,110,255,.22),transparent 62%),radial-gradient(700px 420px at -10% 110%,rgba(255,79,216,.10),transparent 60%),var(--bg);font-feature-settings:"palt","tnum"}
html[data-skin=hud] body::before,html[data-skin=hud] body::after{content:"";position:fixed;left:-20%;right:-20%;top:-40%;bottom:-40%;pointer-events:none;z-index:0}
html[data-skin=hud] body::before{background-image:linear-gradient(rgba(56,225,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,225,255,.06) 1px,transparent 1px);background-size:28px 28px;transform:translate3d(0,calc(var(--par) * .35),0)}
html[data-skin=hud] body::after{background-image:linear-gradient(rgba(56,225,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(56,225,255,.10) 1px,transparent 1px);background-size:140px 140px;transform:translate3d(0,calc(var(--par) * .12),0);mask-image:radial-gradient(closest-side,#000 40%,transparent)}
html[data-skin=hud] main,html[data-skin=hud] #sos,html[data-skin=hud] .sample{position:relative;z-index:1}
html[data-skin=hud] header{background:rgba(5,10,20,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(56,225,255,.35);box-shadow:0 1px 18px rgba(56,225,255,.15)}
html[data-skin=hud] header h1{letter-spacing:.22em;color:var(--neon);text-shadow:0 0 10px rgba(56,225,255,.6)}
html[data-skin=hud] .src button{border-color:rgba(56,225,255,.35);color:#9fc6e8}
html[data-skin=hud] .src button.on{background:rgba(56,225,255,.16);color:#fff;border-color:var(--neon);box-shadow:0 0 10px rgba(56,225,255,.45) inset}
html[data-skin=hud] nav{background:rgba(5,10,20,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(56,225,255,.35)}
html[data-skin=hud] nav button.on{color:var(--neon);box-shadow:inset 0 2px 0 var(--neon),0 -6px 16px -8px var(--neon);text-shadow:0 0 8px rgba(56,225,255,.7)}
html[data-skin=hud] .card{background:var(--card);border:1px solid var(--line);border-top:1px solid var(--neon);padding:10px 12px 6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:0 0 0 1px rgba(56,225,255,.05) inset;animation:hudin .45s ease-out}
html[data-skin=hud] .race-title{letter-spacing:.08em}
html[data-skin=hud] .count{color:var(--neon);text-shadow:0 0 14px rgba(56,225,255,.7);animation:hudpulse 2.4s ease-in-out infinite}
html[data-skin=hud] .num{background:transparent;color:var(--neon);border:1px solid var(--neon);box-shadow:0 0 8px rgba(56,225,255,.35) inset;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex-basis:34px}
html[data-skin=hud] .buy-box .num{background:rgba(56,225,255,.18);color:#fff}
html[data-skin=hud] .lab{background:transparent;color:var(--neon);border:1px solid var(--neon);box-shadow:0 0 6px rgba(56,225,255,.4)}
html[data-skin=hud] .hm,html[data-skin=hud] .badge.hit{color:var(--hit);text-shadow:0 0 10px rgba(255,79,216,.75)}
html[data-skin=hud] .badge.buy{color:var(--neon);text-shadow:0 0 8px rgba(56,225,255,.6)}
html[data-skin=hud] th{border-top-color:rgba(56,225,255,.45);color:#8fb4d8;letter-spacing:.05em}
html[data-skin=hud] .sec>summary{position:relative}
html[data-skin=hud] .sec>summary::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:18px;background:var(--neon);box-shadow:0 0 6px var(--neon);transition:width .45s cubic-bezier(.2,.8,.2,1)}
html[data-skin=hud] .sec[open]>summary::after{width:100%}
html[data-skin=hud] .sec[open]{background:linear-gradient(180deg,rgba(56,225,255,.06),transparent 70%)}
html[data-skin=hud] .sec[open]>div,html[data-skin=hud] details[open]>div{animation:hudunfold .38s cubic-bezier(.2,.8,.2,1)}
html[data-skin=hud] .line{border-left-color:var(--neon);box-shadow:-6px 0 12px -8px var(--neon)}
html[data-skin=hud] .chips{border-bottom-color:rgba(56,225,255,.35)}
html[data-skin=hud] .chips button.on{color:var(--neon);box-shadow:inset 0 -2px 0 var(--neon);text-shadow:0 0 8px rgba(56,225,255,.6)}
html[data-skin=hud] .modebar button.on{background:rgba(56,225,255,.16);border-color:var(--neon);color:#fff}
html[data-skin=hud] .kpi div{border-top-color:rgba(56,225,255,.25)}
html[data-skin=hud] .kpi b{color:#fff;text-shadow:0 0 10px rgba(56,225,255,.45)}
html[data-skin=hud] .sk{color:#ffcf4a;border-color:#ffcf4a;box-shadow:0 0 6px rgba(255,207,74,.45)}
html[data-skin=hud] .sk::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#ffcf4a;margin-right:3px;vertical-align:1px;animation:hudblink 1s steps(2) infinite}
html[data-skin=hud] .rolling{color:var(--neon) !important;text-shadow:0 0 12px rgba(56,225,255,.9)}
html[data-skin=hud] #hudfx{display:block;position:fixed;inset:0;pointer-events:none;z-index:4}
#hudfx i{position:absolute;width:22px;height:22px;border:0 solid rgba(56,225,255,.55)}
#hudfx .c1{top:calc(env(safe-area-inset-top) + 74px);left:6px;border-top-width:1px;border-left-width:1px}
#hudfx .c2{top:calc(env(safe-area-inset-top) + 74px);right:6px;border-top-width:1px;border-right-width:1px}
#hudfx .c3{bottom:calc(env(safe-area-inset-bottom) + 70px);left:6px;border-bottom-width:1px;border-left-width:1px}
#hudfx .c4{bottom:calc(env(safe-area-inset-bottom) + 70px);right:6px;border-bottom-width:1px;border-right-width:1px}
#hudfx .rd{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 44px);padding:2px 12px;font:10px/1.4 ui-monospace,Menlo,Consolas,monospace;color:rgba(56,225,255,.8);letter-spacing:.06em;text-shadow:0 0 6px rgba(56,225,255,.6);background:rgba(5,10,20,.7);border-top:1px solid rgba(56,225,255,.18);white-space:nowrap;overflow:hidden;display:flex;gap:14px}
html[data-skin=hud] main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#hudfx .sw{position:absolute;left:0;right:0;height:80px;top:-80px;background:linear-gradient(180deg,transparent,rgba(56,225,255,.06),transparent);animation:hudsweep 7s linear infinite}
@keyframes hudin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes hudunfold{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes hudpulse{50%{text-shadow:0 0 22px rgba(56,225,255,1)}}
@keyframes hudblink{50%{opacity:0}}
@keyframes hudsweep{to{transform:translateY(calc(100vh + 160px))}}
@media (prefers-reduced-motion:reduce){html[data-skin=hud] *,html[data-skin=hud] *::before,html[data-skin=hud] *::after{animation:none !important;transition:none !important}#hudfx .sw{display:none}}
/*shinbun*/
html:not([data-skin=hud]){--bg:#f4f0e6;--card:#f4f0e6;--text:#1b1916;--sub:#6e675c;--line:#cfc7b6;--accent:#1b1916;--accent2:#ebe5d6;--buy:#b3121f;--buybg:#f7e3df;--hit:#b3121f;--miss:#8f877a;--inv:#f4f0e6}
@media (prefers-color-scheme:dark){html:not([data-skin=hud]){--bg:#1c1a16;--card:#1c1a16;--text:#ece5d5;--sub:#a39a89;--line:#3d382f;--accent:#ece5d5;--accent2:#26231d;--buy:#ff7a72;--buybg:#3a1f1c;--hit:#ff7a72;--miss:#857d70;--inv:#1c1a16}}
html:not([data-skin=hud]) body{font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho","YuMincho",serif;font-feature-settings:"palt","tnum"}
html:not([data-skin=hud]) header{background:var(--bg);color:var(--text);border-bottom:4px double var(--text);padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
html:not([data-skin=hud]) header h1{font-size:24px;font-weight:900;letter-spacing:.18em;display:block;line-height:1.1}
html:not([data-skin=hud]) header .meta{display:block;margin:2px 0 0;font-size:11px;opacity:1;color:var(--sub)}
html:not([data-skin=hud]) .src{margin-top:6px;border-top:1px solid var(--text);padding-top:5px}
html:not([data-skin=hud]) .src button{border:0;color:var(--sub);padding:2px 10px 2px 0;font-size:13px}
html:not([data-skin=hud]) .src button:nth-of-type(2){border-right:0}
html:not([data-skin=hud]) .src button.on{background:none;color:var(--text);font-weight:900;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
html:not([data-skin=hud]) .src .sosb,html:not([data-skin=hud]) .src .skinb{border:1px solid var(--text);color:var(--text);padding:1px 8px;margin-left:6px}
html:not([data-skin=hud]) .src .sosb{margin-left:auto}
html:not([data-skin=hud]) nav{border-top:4px double var(--text)}
html:not([data-skin=hud]) nav button{font-size:14px}
html:not([data-skin=hud]) nav button.on{box-shadow:none;background:var(--text);color:var(--inv)}
html:not([data-skin=hud]) .card{border-top:4px double var(--text)}
html:not([data-skin=hud]) .race-title{font-size:23px;font-weight:900;letter-spacing:.06em}
html:not([data-skin=hud]) .rno{font-size:18px;font-weight:900}
html:not([data-skin=hud]) .num{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:900}
html:not([data-skin=hud]) .count,html:not([data-skin=hud]) .big,html:not([data-skin=hud]) .kpi b{font-weight:900}
html:not([data-skin=hud]) .lab{font-weight:700;letter-spacing:.12em;padding:1px 7px}
html:not([data-skin=hud]) th{border-top:2px solid var(--text);font-weight:700;color:var(--text)}
html:not([data-skin=hud]) .chips{border-bottom:2px solid var(--text)}
html:not([data-skin=hud]) .chips button{font-size:15px}
html:not([data-skin=hud]) .chips button.on{box-shadow:none;background:var(--text);color:var(--inv)}
html:not([data-skin=hud]) .sample{border-bottom:1px solid var(--text);font-size:11px}
html:not([data-skin=hud]) .sk{border-color:var(--buy);color:var(--buy)}
</style>
</head>
<body>
<header><h1>musu 競馬予想</h1><div class="meta" id="meta">読み込み中…</div><div class="src"><button data-src="jra">中央</button><button data-src="nar">地方（検証中）</button><button class="sosb" id="sosb">点検</button><button class="skinb" id="skinb">HUD</button></div></header>
<div id="sos" hidden></div>
<div class="sample" id="sample" hidden></div>
<main id="view"></main>
<nav>
  <button data-tab="next" class="on">次のレース</button>
  <button data-tab="today">今日のレース</button>
  <button data-tab="result">結果</button>
</nav>
<script>
let D = null, H = [], tab = localStorage.getItem("tab") || "next", venue = null, src = localStorage.getItem("src") || "jra";
const lbl = () => D.decision_label || `締切${D.decision_min}分前`;
const $ = s => document.querySelector(s);
const yen = v => (v ?? 0).toLocaleString("ja-JP") + "円";
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function now() { return D && D.now_override ? new Date(D.now_override) : new Date(); }
function t(hm) { const [h, m] = hm.split(":").map(Number); const d = new Date(D.date + "T00:00:00+09:00"); d.setHours(h, m, 0, 0); return d; }

// 単勝の型の切り替え（1=合格版、2=拡大版、3=広め。2・3は検証中）。中央のみ
let modeSel = "1", mode = "1";   // modeSel=選んだ型、mode=今の表示に使う型（地方は常に合格版の扱い）
try { modeSel = localStorage.getItem("mode") || "1"; if (!["1", "2", "3"].includes(modeSel)) modeSel = "1"; } catch {}
const MODES = { "1": "標準", "2": "拡大", "3": "広め" };   // 標準＝合格モデル＋馬主モデル（2026-11-08 から）
const TIERTAG = { 2: "拡大", 3: "広め", 4: "馬主モデルのみ" };
// 単勝の買い: 標準＝合格モデルの買い＋馬主モデルだけの買い（tier 4）。拡大・広めはさらに tier 2・3 を足す
function buysOf(r) {   // 同じ馬が「拡大」と「馬主モデルのみ」の両方に入っていても1頭として数える（2026-11-08 直し）
  const ex = r.buys_ext || [], seen = new Set();
  return r.buys.concat(ex.filter(b => b.tier === 4 || (mode !== "1" && b.tier <= +mode))).filter(b => !seen.has(b.no) && seen.add(b.no));
}
function retOf(r) { if (!r.result) return 0; const w = new Set(r.result.first); return buysOf(r).filter(b => w.has(b.no)).length * (r.result.tan || 0); }
let triKind = "mid"; try { triKind = localStorage.getItem("triKind") || "mid"; } catch {}
function perfBar() {   // モデルの実績: 過去（バックテスト）と本番の通算（history）。2026-11-11
  const sumH = f => { let sp = 0, rt = 0, d = 0; H.forEach(h => { const x = f(h); if (x && x.spent) { sp += x.spent; rt += x.ret; d++; } }); return sp ? `<b>${Math.round(rt / sp * 100)}%</b><span class="sub">（${d}日 ${rt - sp >= 0 ? "+" : ""}${yen(rt - sp)}）</span>` : `<span class="sub">まだなし</span>`; };
  const L = src === "nar" ? [
    ["単勝 標準", "141%", h => ({ spent: h.spent, ret: h.ret })],
    ["単勝 拡大まで", "118%", h => h.ext && h.ext["2"]],
    ["単勝 広めまで", "113%", h => h.ext && h.ext["3"]],
    ["妙味ワイド", "110%", h => h.myomi],
    ["3連単 中穴", "122%", h => h.tri],
    ["3連単 大穴", "141%", h => h.tria],
    ["3連複", "120%", h => h.trio]] : [
    ["単勝 標準", "134%", h => (h.ext && h.ext["4"] && h.ext["4"].spent) ? h.ext["4"] : { spent: h.spent, ret: h.ret }],
    ["単勝 拡大まで", "117%", h => h.ext && h.ext["2"]],
    ["単勝 広めまで", "105%", h => h.ext && h.ext["3"]],
    ["3連単（試験）", "108%", h => h.tri],
    ["3連複（試験）", "112%", h => h.trio],
    ["単勝の馬1着の3連単", "144%", h => h.axis && h.axis["2"]],
    ["お楽しみ", "92%", h => ({ spent: h.a_spent, ret: h.a_ret })],
    ["参考の組合せ", "—", h => h.exo]];
  return `<div class="card" style="margin-bottom:8px"><div class="sub" style="margin-bottom:2px">モデルの実績（${src === "nar" ? "地方" : "中央"}）</div>
    <table><tr><th style="text-align:left">買い目</th><th>過去の回収率</th><th>本番の通算</th></tr>${L.map(([n, b, f]) => `<tr><td style="text-align:left;white-space:nowrap">${n}</td><td>${b}</td><td>${sumH(f)}</td></tr>`).join("")}</table>
    <div class="note">過去＝バックテストの年ごとの平均（${src === "nar" ? "地方 2020〜26年" : "中央 2018〜26年"}）。本番＝実際に予想を出し始めてからの記録（各100円の想定、お金は賭けていない）。</div></div>`;
}
function triBoth(r) { const k = triKind; triKind = "mid"; let h = triBox(r); if (src === "nar" && r.tri && (r.tri.ana || []).length) { triKind = "ana"; h += triBox(r); } triKind = k; return h; }
function modeBar() { return perfBar();   // 地方も切り替えあり（2026-11-08）
  const L = { "1": "標準", "2": "拡大", "3": "広め" };
  const tk = src === "nar" ? `<div class="modebar">3連単　 ${[["mid", "中穴"], ["ana", "大穴"]].map(([k, v]) => `<button data-tk="${k}" class="${k === triKind ? "on" : ""}">${v}</button>`).join("")}<span>${triKind === "ana" ? "（1着を単勝の穴馬に固定・試験中）" : "（2・3着の滑り込み）"}</span></div>` : "";
  return `<div class="modebar">単勝の範囲 ${Object.entries(L).map(([k, v]) => `<button data-mode="${k}" class="${k === mode ? "on" : ""}">${v}</button>`).join("")}<span>${mode === "1" ? "" : "（試験中）"}</span></div>` + tk;
}

function sk(r) { return r.result && r.result.src === "速報" ? '<span class="sk">速報</span>' : ""; }

function status(r) {
  if (r.state === "out") return ["対象外", "miss"];
  const bs = buysOf(r);
  if (r.result && r.state === "decided") { const [a_, b_] = bs.length ? (retOf(r) > 0 ? ["単勝 的中", "hit"] : ["単勝 外れ", "miss"]) : ["単勝 見送り", "miss"]; return [a_ + sk(r), b_]; }
  if (r.state === "missed") return ["単勝 判定なし", "miss"];
  if (r.state === "decided") return bs.length ? [`単勝 ${bs.length}頭`, "buy"] : ["単勝 見送り", ""];
  return ["予想前", ""];
}

}

function triOn() { return src === "nar" || (D && D.races.some(x => x.tri)); }   // その日に3連単・3連複の計算が動いているか

function triBox(r) {
  // 3連単（地方・試験中）: 1着は勝率、2・3着は「滑り込む力」（3着内モデル）で直した並び確率 × 推定オッズ。10点まで、期待値で金額に濃淡
  // 大穴（2026-11-11）: 1着を単勝の穴モデルの馬（10〜100倍・期待値1.2以上）に固定。切り替えは triKind
  const ana = triKind === "ana" && src === "nar", v0 = r.tri; if (!v0) return miokuri(r, ana ? "3連単 大穴" : "3連単");
  const v = ana ? { bets: v0.ana || [], total: v0.ana_total || 0, horses: v0.horses } : v0; if (!v.bets.length) return miokuri(r, ana ? "3連単 大穴" : "3連単");
  const res = ana ? r.tria_res : r.tri_res, hit = new Set(res ? res.hits : []);
  const badge = res ? (res.ret ? `<span class="badge hit">的中 ${yen(res.ret)}</span>` : `<span class="badge miss">外れ</span>`) : `<span class="sub">${v.bets.length}点 ${yen(v.total)}</span>`;
  const rows = v.bets.map(b => `<tr${hit.has(b.kumi) ? ' style="background:var(--buybg);font-weight:800"' : ""}><td style="text-align:left"><b>${esc(b.kumi)}</b>${hit.has(b.kumi) ? " <b class=hm>的中</b>" : ""}</td><td>${(b.p * 100).toFixed(1)}%</td><td>${fmtO(b)}</td><td>${yen(b.amt)}</td></tr>`).join("");
  const hs = (v.horses || []).map(h => `<tr><td style="text-align:left"><b>${h.no}</b> <span style="font-size:11px">${esc(h.name || "")}</span></td><td>${h.ninki}</td><td><b>${pct(h.t3)}</b></td><td>${pct(h.t3m)}</td></tr>`).join("");
  return `<details class="sec" data-k="tri"><summary><span><i class="lab">${ana ? "3連単 大穴" : "3連単"}</i><span class="sub">${v.bets.slice(0, 2).map(b => esc(b.kumi)).join("　")}${v.bets.length > 2 ? " ほか" : ""}</span></span>${badge}</summary>

    </div></details>`;
}

function simMore(v, res, r) {   // の中の「▼ 10万回の中身」: 上位10の決着と馬ごとの着順（開いた時だけ）
  if (!v.horses && !v.trio10) return "";

  const od = {}; ((r && r.top) || []).forEach(x => { od[x.no] = x.odds; });   // 判定した時点の単勝オッズ
  const hs = (v.horses || []).map(h => `<tr><td style="text-align:left"><b>${h.no}</b>${od[h.no] ? `<span class="sub" style="font-size:10px"> ${od[h.no]}倍</span>` : ""}<div class="sub" style="font-size:10px;max-width:4.2em;overflow:hidden;text-overflow:ellipsis">${esc(h.name || "")}</div></td>
      <td>${k(h.p1)}</td><td>${k(h.p2)}</td><td>${k(h.p3)}</td><td><b>${pct(h.p1)}</b></td><td>${pct(h.p1 + h.p2)}</td><td>${pct(h.p1 + h.p2 + h.p3)}</td></tr>`).join("");
  return `<details class="info" style="margin-top:8px"><summary>▼ 10万回の中身（上位10の決着・馬ごとの着順）</summary>
    ${hs ? `<div class="sub" style="margin:6px 0 2px">馬ごと（10万回のうち何回その着順か。倍＝判定した時点の単勝オッズ）</div>
    <div style="overflow-x:auto"><table class="sim"><tr><th style="text-align:left">馬</th><th>1着</th><th>2着</th><th>3着</th><th>勝率</th><th>連対</th><th>複勝</th></tr>${hs}</table></div>` : ""}
    ${v.trio10 ? `<div class="sub" style="margin:8px 0 2px">3連複 上位10</div><table class="sim"><tr><th>順</th><th style="text-align:left">組</th><th>10万回中</th>${v.trio10.some(y => y.odds) ? "<th>オッズ</th>" : ""}</tr>${mark(v.trio10, res && res.trio)}</table>` : ""}
    ${v.tri10 ? `<div class="sub" style="margin:8px 0 2px">3連単 上位10</div><table class="sim"><tr><th>順</th><th style="text-align:left">組</th><th>10万回中</th>${v.tri10.some(y => y.odds) ? "<th>オッズ</th>" : ""}</tr>${mark(v.tri10, res && res.trifecta)}</table>` : ""}
  </details>`;
}

function paceBox(r) {
  // 展開予想（検証中）
  const v = r.pace; if (!v) return "";
  const res = r.pace_res, lab = { high: "ハイペースなら", slow: "スローなら", inner: "内が伸びる馬場なら", outer: "外が伸びる馬場なら", chaos: "荒れるなら", calm: "堅く決まるなら" };
  // もしもの展開: 展開ごとに「⬆浮く馬」と「⬇沈む人気馬（勝率の上位3頭のうち、いちばん下がる馬）」を1行に（2026-11-08 見やすく）
  const lab2 = { high: "ハイペース", slow: "スロー", inner: "内が有利", outer: "外が有利", chaos: "荒れる" };
  const cell = (h, up) => h ? `<b>${h.no}</b> <span style="font-size:11px">${esc(h.name || "")}</span><div class="sub" style="font-size:10.5px">3着内 ${pct(h.t3)}（<span style="color:${up ? "var(--hit)" : "var(--buy)"}">${up ? "+" : ""}${(h.diff * 100).toFixed(0)}pt</span>）</div>` : `<span class="sub">—</span>`;
  const sr = ["high", "slow", "inner", "outer", "chaos"].filter(k => v.scen[k] && (v.scen[k].diff > 0.02 || v.scen[k].down))
    .map(k => `<tr><td style="text-align:left;white-space:nowrap;font-size:11px">${lab2[k]}</td><td style="text-align:left;white-space:normal">${v.scen[k].diff > 0.02 ? cell(v.scen[k], true) : cell(null)}</td><td style="text-align:left;white-space:normal">${cell(v.scen[k].down, false)}</td></tr>`).join("");
  const sc = sr ? `<table class="sim" style="table-layout:fixed"><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup><tr><th style="text-align:left">もしも〜なら</th><th style="text-align:left">浮く馬</th><th style="text-align:left">沈む人気馬</th></tr>${sr}</table>` : "";
  const tri = v.trifecta[0], trio = v.trio[0];
  let today = "";
  if (v.today) {
    const t_ = v.today, words = [];
    if (t_.front === "front") words.push("前に行った馬が残っている");
    if (t_.front === "back") words.push("後ろからの差しが決まっている");
    if (t_.gate === "inner") words.push("内枠が来ている");
    if (t_.gate === "outer") words.push("外枠が来ている");
    const pk = t_.pick && v.scen[t_.pick];
    today = words.length
      ? `<div class="line"><b>今日の馬場　${words.join("・")}</b>${pk ? `<br>→ この馬場なら <b>${pk.no}番 ${esc(pk.name)}</b>（3着以内 ${pct(pk.t3)}）` : ""}<div class="sub">この場の前の${t_.n}レースから自動で判断（同じ傾向が続くのは6割ほど）</div></div>`
      : `<div class="line mute">今日の馬場　${t_.n ? "はっきりした偏りはまだ見えない" : "この場の最初のレースなので、まだ分からない"}</div>`;
  }
  const hit = res ? (res.tri_rank ? `<span class="badge hit">3連単 的中！</span>` : res.trio_rank ? `<span class="badge hit">3連複 的中</span>` : `<span class="badge miss">外れ（${esc(res.trio)}${(() => { const i = (v.trio10 || []).findIndex(x => x.kumi === res.trio); return i >= 0 ? `・${i + 1}番目` : ""; })()}）</span>`) : "";
  return `${today}
    <details class="sec"><summary><span><i class="lab">展開</i>起きやすい決着 <b>3連複 ${esc(trio.kumi)}</b></span>${hit || '<span class="sub">くわしく ▼</span>'}</summary>
    <div style="padding:6px 0 8px">
      ${v.front && v.front.length ? `<div>前に行きそう：<b>${v.front.map(h => `${h.no}番`).join("・")}</b>　後ろから：${v.back.map(h => `${h.no}番`).join("・")}</div>` : ""}
      <div style="margin-top:4px">10万回走らせると：3連単 <b>${esc(tri.kumi)}</b> が約${Math.round(tri.p * 100000).toLocaleString()}回、3連複 <b>${esc(trio.kumi)}</b> が約${Math.round(trio.p * 100000).toLocaleString()}回（いちばん多い決着）</div>
      ${sc ? `<div class="sub" style="margin-top:6px">もしもの展開（3着以内の確率が、ふつうの見立てから何pt動くか）</div>${sc}` : ""}
      ${simMore(v, res, r)}
      <details class="info legend"><summary>展開予想について</summary><div class="note">ペース・馬場の内外・荒れ具合で馬が「まとめて動く」ことを入れて全通りを計算（10万回のシミュレーションを無限回まわしたのと同じ）。過去の確認で、今の計算より1〜3着の当たり方がわずかに良い。（検証中）</div></details>
    </div></details>`;
}

function asobiBox(r) {
  // お楽しみ馬券（遊び用・別帳簿）
  const res = r.asobi_res, hit = new Set(res ? res.hits : []);
  if (!r.asobi.length) return "";
  const n3 = r.asobi.filter(e => e.type === "3連複").length, nt = r.asobi.length - n3;
  const badge = res ? `<span class="badge ${res.hits.length ? "hit" : "miss"}">${res.hits.length ? "的中 " + yen(res.ret) : "外れ"}</span>` : `<span class="sub">${[n3 ? `3連複${n3}点` : "", nt ? `3連単${nt}点` : ""].filter(Boolean).join("・")}・${yen(100 * r.asobi.length)}</span>`;
  return `<details class="sec" style="border-style:dashed"><summary><span><i class="lab">お楽しみ馬券</i></span>${badge}</summary>
    <table><tr><th>券種</th><th>組番</th><th>オッズ</th></tr>${r.asobi.map(e => `<tr><td>${esc(e.type)}</td><td>${hit.has(e.kumi) ? "" : ""}${esc(e.kumi)}</td><td>${e.odds.toFixed(1)}</td></tr>`).join("")}</table>
    <details class="info legend"><summary>お楽しみ馬券について</summary><div class="note">各100円。オッズ30〜100倍（配当3,000〜10,000円）で、勝率モデルから見て期待値の高い組。過去の試算の回収率は3連複で約8割、3連単で約10割。勝てると確認された買い方ではないので、遊ぶ金額を決めて楽しむ用です。</div></details></details>`;
}

function raceDetail(r, opt = {}) {
  const [s, cls] = status(r);
  let html = "";
  if (!opt.noHead) html += `<div class="row between"><div><p class="race-title">${esc(r.venue)} ${r.R}R</p>
    <div class="sub">${[r.name ? esc(r.name) : "", `発走 ${r.post}`, `締切 ${r.close}`].filter(Boolean).join(" ・ ")}</div></div><span class="badge ${cls}">${s}</span></div>`;
  if (r.state === "out" || r.state === "missed") {
    html += `<div class="line mute">${esc(r.note || "予想の対象外")}</div>`;
  } else if (r.state === "decided" || r.result) {
    html += oshiBox(r);
    html += myomiBox(r);
    html += triBoth(r);
    html += trioBox(r);
    html += paceBox(r);
    const bs = buysOf(r);
    html += bs.length
      ? `<div class="buy-box"><h3>単勝で買う（各100円・札なし＝標準、札＝拡大・広め）</h3>${horseRows(bs, true)}${bs.some(b => b.both !== undefined || b.tier === 4) ? `<div class="note">★両方＝合格モデルと馬主モデルの両方が「買い」（いちばん信頼できる）。「〜のみ」は片方だけが「買い」。</div>` : ""}</div>`
      : `<div class="line mute">単勝：${r.note ? "予想できませんでした（" + esc(r.note) + "）" : "見送り"}</div>`;
    html += axisBox(r);
    if (r.asobi) html += asobiBox(r);
    let more = "";
    if (r.top && r.top.length) more += `<div class="sub" style="margin-top:6px">勝率の高い順</div>${horseRows(r.top, false)}`;
    if (r.exo && r.exo.length) more += `<div class="sub" style="margin-top:8px">参考：組合せ馬券（検証中・記録用）</div>
      <table><tr><th>券種</th><th>組番</th><th>オッズ</th><th>期待値</th></tr>${r.exo.map(e => `<tr${r.exo_res && r.exo_res.hits.includes(e.type + " " + e.kumi) ? ' style="background:var(--buybg);font-weight:800"' : ""}><td>${esc(e.type)}</td><td>${esc(e.kumi)}${r.exo_res && r.exo_res.hits.includes(e.type + " " + e.kumi) ? " <b class=hm>的中</b>" : ""}</td><td>${e.odds.toFixed(1)}</td><td>${e.ev.toFixed(2)}</td></tr>`).join("")}</table>`;
    more += `<div class="note">${D.rule_note ? esc(D.rule_note) : `オッズは判定時（締切${D.decision_min}分前）の値。単勝の買う条件: 10〜50倍 かつ 期待値1.15以上。`}</div>`;
    html += `<details class="info" style="margin-top:8px"><summary>▼ くわしい数字（勝率の順・参考の組合せ）</summary>${more}</details>`;
  } else {
    html += `<div class="line mute">予想 ${r.decide}ごろ（${lbl()}）</div>`;
  }
  if (r.result) {
    html += `<div class="note" style="margin-top:8px">結果${sk(r)}　1着 <b>${r.result.first.join("・")}番</b> ${esc(r.result.first_name || "")}　単勝 ${yen(r.result.tan)}${r.result.tan ? `（${(r.result.tan / 100).toFixed(1)}倍）` : ""}${buysOf(r).length ? `　／　単勝の収支 ${yen(retOf(r) - 100 * buysOf(r).length)}` : ""}</div>`;
  }
  return html;
}

function viewNext() {
  const n = now();
  const up = D.races.filter(r => r.state !== "out" && t(r.post) > n).sort((a, b) => t(a.post) - t(b.post));
  if (!up.length) return `<div class="card"><p class="race-title">本日終了</p><div class="sub">結果は「結果」タブ。</div></div>`;
  const r = up[0], cl = t(r.post)
  const sb = scoreBar(), left = Math.max(0, Math.floor((cl - n) / 1000));
  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  const [s, cls] = status(r);
  let html = sb + win5Box() + `<div class="card" data-k="n${r.id}"><div class="row between"><div><p class="race-title">${esc(r.venue)} ${r.R}R</p>
      <div class="sub">${[r.name && r.name !== r.venue ? esc(r.name) : "", `発走 ${r.post}`].filter(Boolean).join(" ・ ")}</div></div>
      <div style="text-align:right"><div class="sub">発走まで</div><div class="count" id="cd" data-close="${cl.toISOString()}">${mm}:${ss}</div></div></div>
    ${raceDetail(r, { noHead: true })}</div>`;
  const after = up.slice(1, 4);
  if (after.length) html += `<div class="card"><div class="sub" style="margin-bottom:4px">このあとのレース</div>${after.map(x => rowHtml(x, true)).join("")}</div>`;
  return html;
}

function scoreBar() {   // 次のレースの上: 今日ここまでの当たり（結果が1つも無ければ出さない）
  const od = D.races.filter(r => r.oshi_res), pr = D.races.filter(r => r.pace_res);
  const bets = D.races.filter(r => r.result && r.state === "decided" && buysOf(r).length);
  const parts = [];
  if (od.length) parts.push(`推し <b>${od.filter(r => r.oshi_res.hit).length}/${od.length}</b> 3着内`);
  if (bets.length) { const sp = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), rt = bets.reduce((a, r) => a + retOf(r), 0);
    parts.push(`単勝 <b>${bets.filter(r => retOf(r) > 0).length}/${bets.length}</b>（<b style="color:${rt - sp > 0 ? "var(--hit)" : "inherit"}">${rt - sp >= 0 ? "+" : ""}${yen(rt - sp)}</b>）`); }
  if (pr.length) parts.push(`決着 <b>${pr.filter(r => r.pace_res.trio_rank).length}/${pr.length}</b>`);
  if (!parts.length) return "";
  return `<div class="sub" style="margin:0 2px 8px;line-height:1.8">今日ここまで　${parts.map(x => `<span style="white-space:nowrap">${x}</span>`).join("　")}</div>`;
}

function win5Box() {   // WIN5（試験中）: 対象5レース、買い目（フォーメーション）、結果
  const w = D.win5; if (!w || src !== "jra") return "";
  const R_ = id => D.races.find(r => r.id === id) || {};
  const nm = id => { const r = R_(id); return r.venue ? `${esc(r.venue)}${r.R}R` : id.slice(-4); };
  let body = "";
  if (w.note) body = `<div class="sub">${esc(w.note)}</div>`;
  else if (w.pending) body = `<div class="sub">対象：${w.legs.map(nm).join("・")}<br>買い目は1レース目（${nm(w.legs[0])}）の発走10分前に出します。</div>`;
  else {
    const ff = w.forms || [];
    const head = `<tr><th style="text-align:left">レース</th>${ff.map((f, i) => `<th>買い目${i + 1}</th>`).join("")}</tr>`;
    const rows = w.legs.map((id, k) => { const win = R_(id).result ? new Set(R_(id).result.first) : null;
      return `<tr><td style="text-align:left;white-space:nowrap">${k + 1}. ${nm(id)}</td>${ff.map(f => `<td style="text-align:left">${f[k].map(n => win && win.has(n) ? `<b style="color:var(--hit)">${n}</b>` : n).join("・")}</td>`).join("")}</tr>`; }).join("");
    const pts = ff.map(f => f.reduce((a, s) => a * s.length, 1));
    const res = w.res ? (w.res.hit ? `<span class="badge hit">的中 ${yen(w.res.pay)}</span>` : `<span class="badge miss">外れ</span>`) : "";
    body = `<div class="row between" style="margin-bottom:6px"><div class="sub">合計 <b>${w.pts}点（${yen(100 * w.pts)}）</b>・${w.at}判定</div>${res}</div>
      <div style="overflow-x:auto"><table class="sim">${head}${rows}<tr><td style="text-align:left" class="sub">点数</td>${pts.map(p => `<td class="sub">${p}点</td>`).join("")}</tr></table></div>
      <div class="note">即PATの「フォーメーション」で、買い目ごとに各レースの馬を選んで入れます（買い目どうしの重なりは合計から除いています）。少なく買うなら買い目1から順に。</div>
      ${(w.top || []).length ? `<details class="info"><summary>▼ 期待値の高い組（上位${w.top.length}）</summary><table class="sim"><tr><th>順</th><th style="text-align:left">組</th><th>起きる確率</th></tr>${w.top.map((x, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${x.kumi.join("-")}</td><td>${(x.p * 100).toFixed(3)}%</td></tr>`).join("")}</table></details>` : ""}`;
  }
  return `<div class="card"><details class="sec" data-k="w5" open><summary><span><i class="lab">WIN5</i>（試験中）</span><span class="sub">${w.legs.map(nm).join("・")}</span></summary><div style="padding:6px 0">${body}
    <details class="info legend"><summary>この買い方について</summary><div class="note">5レースの勝率と「世間の WIN5 の票の入り方（人気馬に偏る）」から、当たれば配当が大きい割に起きやすい組を選びます。過去（2023-26、256回）は1回1000点で約140%、的中は10回に1回ほど。市場だけで同じことをすると約66%。外れが何週も続くのが普通の買い方です。まだ確かめ中なので、紙の上の記録を続けています。</div></details></div></details></div>`;
}

function opt_id(r) {   // 今日のレースで、次に締切が来るレースの行に印（開いた時にそこまで動かす）
  const nx = D.races.filter(x => x.state !== "out" && t(x.post) > now()).sort((a, b) => t(a.post) - t(b.post))[0];
  return nx && nx.id === r.id ? ' id="nextrow"' : "";
}

function rowHtml(r, showVenue) {
  const [s, cls] = status(r);
  const bs = (r.state === "decided") ? buysOf(r) : [];
  const tags = [];
  if (r.myomi) tags.push(`妙 ${r.myomi.axis.no}×${r.myomi.ana.map(h => h.no).join("・")}${r.myomi_res ? (r.myomi_res.ret ? '<b class=hm>中</b>' : "") : ""}`);
  if (r.tri && r.tri.bets.length) tags.push(`単${r.tri.bets.length}点${r.tri_res && r.tri_res.ret ? "<b class=hm>中</b>" : ""}`.replace(/^単/, "三連単 "));
  if (r.tri && (r.tri.ana || []).length && src === "nar") tags.push(`三連単大穴 ${r.tri.ana.length}点${r.tria_res && r.tria_res.ret ? "<b class=hm>中</b>" : ""}`);
  if (r.tri && (r.tri.trio || []).length) tags.push(`三連複 ${r.tri.trio.length}点${r.trio_res && r.trio_res.ret ? "<b class=hm>中</b>" : ""}`);
  if (r.state === "decided" && triOn()) {
    const tk = false, nb = r.tri ? (tk ? (r.tri.ana || []) : r.tri.bets).length : 0, nt = r.tri ? (r.tri.trio || []).length : 0;
    if (!nb && !nt) tags.push(`<span style="color:var(--sub)">三連 見送り</span>`);
    else if (!nb) tags.push(`<span style="color:var(--sub)">三連単 見送り</span>`);
    else if (!nt) tags.push(`<span style="color:var(--sub)">三連複 見送り</span>`);
  }
  if (r.oshi) tags.push(`推 ${r.oshi.no}${r.oshi_res ? (r.oshi_res.hit ? '<b class=hm>中</b>' : "") : ""}`);
  if (bs.length) tags.push(`単 ${bs.map(b => b.no).join("・")}${r.result && retOf(r) > 0 ? '<b class=hm>中</b>' : ""}`);
  if (r.result) tags.push(`<span style="color:var(--sub)">1着${r.result.first.join("・")}番${r.result.tan ? ` ${(r.result.tan / 100).toFixed(1)}倍` : ""}</span>`);
  return `<details class="rrow-wrap" data-k="r${r.id}"${opt_id(r)}><summary class="rrow"><div class="rno">${r.R}R</div>
    <div class="rmid"><div class="n">${showVenue ? esc(r.venue) + " " : ""}${esc(r.name && r.name !== r.venue ? r.name : "")}</div><div class="sub">発走 ${r.post}${tags.map(x => `　<span style="white-space:nowrap">${x}</span>`).join("")}</div></div>
    <span class="badge ${cls}">${s}</span></summary><div style="padding:4px 0 12px">${raceDetail(r, { noHead: true })}</div></details>`;
}

function viewToday() {
  const venues = [...new Set(D.races.map(r => r.venue))];
  if (!venue || !venues.includes(venue)) {
    const nx = D.races.filter(r => r.state !== "out" && t(r.post) > now()).sort((a, b) => t(a.post) - t(b.post))[0];
    venue = nx ? nx.venue : venues[0];
  }
  const chips = `<div class="chips">${venues.map(v => `<button data-v="${esc(v)}" class="${v === venue ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
  const list = D.races.filter(r => r.venue === venue).sort((a, b) => a.R - b.R);
  return win5Box() + chips + `<div class="card">${list.map(r => rowHtml(r, false)).join("")}</div>`;
}

function btCard() {   // 地方の買い目ごとの過去の成績（バックテスト、年ごとの数字の平均。2026-11-11 時点）
  const rows = [
    ["単勝", "141%", "7%", "1.4R", "2022〜26（毎年133〜163%）"],
    ["妙味ワイド", "110%", "40%", "4.6R", "2023〜26（107%・114%）"],
    ["3連単 中穴", "122%", "9%", "19〜22R", "2020〜26（毎年112〜132%）"],
    ["3連複", "120%", "22%", "16〜22R", "2020〜26（毎年114〜127%）"],
    ["3連単 大穴", "141%", "1〜2%", "6〜7R", "2022〜26（109〜175%、宝くじ型）"]];
  return `<div class="card"><div class="sub" style="margin-bottom:4px">過去の成績（地方・バックテスト）</div>
    <table><tr><th style="text-align:left">買い目</th><th>回収率</th><th>的中</th><th>1日</th></tr>${rows.map(r => `<tr><td style="text-align:left;white-space:nowrap">${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td></tr><tr><td colspan="4" class="sub" style="border-top:0;padding-top:0;text-align:left">${r[4]}</td></tr>`).join("")}</table>
    <div class="note">期待値の目安＝回収率（100円が平均いくらで戻るか）。発走10分前のオッズで決めた場合の過去の結果（2020〜21年は確定オッズで代用）。2025〜26年は形を選ぶときに何度も見た期間なので、実際はこれより低めに出ると見ておく。</div></div>`;
}
function fmtO(b) { const o = b.odds; if (o == null) return b.est ? `<span class="sub">推定${Math.round(b.est)}</span>` : "—"; return Array.isArray(o) ? `${o[0]}〜${o[1]}` : `${o}`; }

function viewResult() {
  // 結果タブ: いちばん上に「今日のまとめ」（種類ごとに1行）、その下に通算、細かい表は押すと開く
  const done = D.races.filter(r => r.result && r.state === "decided");
  const pctS = (r_, s_) => s_ ? ((r_ / s_) * 100).toFixed(0) + "%" : "—";
  const pm = v => `<b style="color:${v > 0 ? "var(--hit)" : "inherit"}">${v > 0 ? "+" : ""}${yen(v)}</b>`;
  const rows = [];
  // 単勝
  // 収支の欄: 買った額 → 払戻 → 差し引き・回収率 を全部書く（どれか1つだけだと誤解されるため）
  const money = (r_, s_) => `<div class="sub">買い ${yen(s_)}<br>→ 払戻 ${yen(r_)}</div>${pm(r_ - s_)}<span class="sub">・回収率 <b>${pctS(r_, s_)}</b></span>`;
  for (const [mm, lb] of [["1", "単勝 標準"], ["2", "単勝 拡大まで"], ["3", "単勝 広めまで"]]) {
    mode = mm;
    const bets = done.filter(r => buysOf(r).length);
    const spent = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), ret = bets.reduce((a, r) => a + retOf(r), 0);
    rows.push([lb, bets.length ? `${bets.filter(r => retOf(r) > 0).length}/${bets.length}<div class="sub" style="font-size:10px">${bets.reduce((a, r) => a + buysOf(r).length, 0)}頭</div>` : "—", spent ? money(ret, spent) : `<span class="sub">買いなし</span>`]);
  }
  mode = "3";
  // 推し
  const od = D.races.filter(r => r.oshi_res);
  if (D.races.some(r => r.oshi)) rows.push(["推し", `${od.filter(r => r.oshi_res.hit).length}/${od.length}`, `<span class="sub">3着以内に来た数${od.filter(r => r.oshi_res.win).length ? `（1着 ${od.filter(r => r.oshi_res.win).length}）` : ""}</span>`]);
  // 3連単（地方）
  const ta_ = D.races.filter(r => r.tria_res && r.tria_res.bet);
  if (ta_.length) { const ts = ta_.reduce((a, r) => a + r.tria_res.bet, 0), tr = ta_.reduce((a, r) => a + r.tria_res.ret, 0);
    rows.push(["3連単 大穴", `${ta_.filter(r => r.tria_res.ret).length}/${ta_.length}`, money(tr, ts)]); }

function rollNumbers() {

  const els = [...document.querySelectorAll("#view .kpi b, #view .big, #view .badge.hit, #view .count:not(#cd), #view td b, #view .hm")];
  els.forEach((el, i) => {

    const prev = ROLL.get(k); ROLL.set(k, t);

    el.dataset.rolling = "1"; el.classList.add("rolling");
    const t0 = performance.now(), dur = 520 + Math.random() * 380;

let parQ = false;

  requestAnimationFrame(() => { document.documentElement.style.setProperty("--par", (-window.scrollY) + "px"); parQ = false; }); }, { passive: true });
document.body.insertAdjacentHTML("beforeend", '<div id="hudfx" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><div class="sw"></div><div class="rd" id="hudrd"></div></div>');
setInterval(() => { if (skin !== "hud" || !D) return; const d = new Date(Date.now() + 9 * 3600000), rs = D.races || [];
  const dec = rs.filter(r => r.state === "decided").length, res = rs.filter(r => r.result).length, sk_ = rs.filter(r => r.result && r.result.src === "速報").length;
  $("#hudrd").innerHTML = `<span>SYS ${d.toISOString().slice(11, 19)}</span><span>${src === "nar" ? "NAR" : "JRA"} ● LIVE</span><span>PRED ${dec}/${rs.length}</span><span>RES ${res}${sk_ ? `・速報${sk_}` : ""}</span>`; }, 1000);
$("#skinb").onclick = () => setSkin(skin === "hud" ? "paper" : "hud");
setSkin(skin);
load();
// 緊急チェック: 中継サービス ntfy.sh の合言葉チャンネルに合図 → PC の緊急チェック係（code\musu_sos.py）が点検・修正し data/sos.json に結果を出す
const SOS_TOPIC = "musu-sos-6f1873a77b020c2b";
function sosShow(h) { const b = $("#sos"); b.hidden = false; b.innerHTML = `<button class="x" onclick="$('#sos').hidden=true">×</button>` + h; }
function sosRes(j) {
  const head = j.phase === "fixing" ? "直しています…" : j.ok ? "<b class=hm>的中</b> 正常に動いています" : "直りきっていません";
  return `<b>${head}</b>${j.note ? `<div>${j.note}</div>` : ""}<div class="sub">点検 ${j.checked.slice(11, 16)}</div>` +
    j.items.map(x => `<div class="it"><span class="${x.ok ? "ok" : "ng"}">${x.ok ? "○" : "×"} ${x.name}</span>：${x.msg}${x.fix ? `<br>→ ${x.fix}` : ""}</div>`).join("");
}
$("#sosb").onclick = async () => {
  if (!confirm("PC に緊急チェックを頼みますか？（点検して、直るところまで直します）")) return;
  const t0 = Date.now();
  try { await fetch(`https://ntfy.sh/${SOS_TOPIC}`, { method: "POST", body: "check" }); }
  catch { sosShow("合図を送れませんでした（電波を確認）"); return; }
  sosShow("PC に合図を送りました。点検中です（1〜3分）…");
  for (let i = 0; i < 60; i++) {   // 直して確かめるのを最大3回くり返すので、最長15分ほど待つ
    await new Promise(r => setTimeout(r, 15000));
    try {
      const j = await (await fetch("data/sos.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (new Date(j.asked + "+09:00") >= t0 - 60000) { sosShow(sosRes(j)); if (j.phase !== "fixing") { load(); return; } continue; }
    } catch {}
    sosShow(`PC に合図を送りました。点検中です…（${Math.round((Date.now() - t0) / 60000)}分経過）`);
  }
  sosShow("PC から返事がありません。PC の電源・ネット接続か、緊急チェック係（タスク musu_sos）が動いていない可能性があります。");
};
