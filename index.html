<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="musu競馬">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<title>musu 競馬予想</title>
<script>try { const th = localStorage.getItem("theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch {}</script>
<style>/*ledger 2026-11-14: 画面の作り直し（見た目と使い勝手だけ。データと計算は前のまま）*/
:root{
  --bg:#f2f1ed;--sf:#fff;--ink:#131517;--ink2:#4c5258;--ink3:#868c92;--line:#ebe9e4;--line2:#d8d5ce;--fill:#f2f1ed;
  --go:#0b7a3f;--gobg:#e2f2e8;--hit:#d2281a;--hitbg:#fdebe8;--warn:#a55906;--warnbg:#fbefdb;--inv:#fff;--glass:rgba(255,255,255,.88);
  --txt:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",-apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  --hh:86px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a0b0c;--sf:#141618;--ink:#f3f3f0;--ink2:#b3b8bd;--ink3:#7c8288;--line:#222528;--line2:#363b40;--fill:#1c1f22;
  --go:#43d686;--gobg:#102b1d;--hit:#ff6455;--hitbg:#361815;--warn:#f3a842;--warnbg:#34260f;--inv:#0a0b0c;--glass:rgba(20,22,24,.86);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0a0b0c;--sf:#141618;--ink:#f3f3f0;--ink2:#b3b8bd;--ink3:#7c8288;--line:#222528;--line2:#363b40;--fill:#1c1f22;
  --go:#43d686;--gobg:#102b1d;--hit:#ff6455;--hitbg:#361815;--warn:#f3a842;--warnbg:#34260f;--inv:#0a0b0c;--glass:rgba(20,22,24,.86);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--txt);font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto}

/* ---- 上の帯 */
header{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
.h1{display:flex;align-items:center;gap:6px;height:36px}
.logo{margin:0;font-size:20px;font-weight:800;letter-spacing:-.035em;line-height:1}
.logo small{font-size:11px;font-weight:600;color:var(--ink3);margin-left:6px;letter-spacing:.1em}
.seg{margin-left:auto;display:flex;background:var(--fill);border-radius:10px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:none;font-size:13px;font-weight:600;color:var(--ink3);padding:6px 16px;border-radius:8px;transition:color .15s}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.08)}
.ib{width:36px;height:36px;margin-right:-8px;border:0;background:none;color:var(--ink2);display:grid;place-items:center;border-radius:10px}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.ib:active,.seg button:active,.sosb:active{opacity:.55}
.h2{display:flex;align-items:center;gap:7px;height:30px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
#meta{flex:0 1 auto;border:0;background:none;padding:6px 0 6px 3px;margin-left:-3px;font-size:inherit;color:inherit;display:block;text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-block;width:6px;height:6px;margin:0 8px 1px 0;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px var(--gobg)}
.live.stale{background:var(--warn);box-shadow:0 0 0 3px var(--warnbg)}
.live.spin{animation:blink .7s ease-in-out infinite}
#meta b{color:var(--warn);font-weight:600}
.sosb{margin-left:auto;flex:0 0 auto;white-space:nowrap;border:0;background:none;box-shadow:inset 0 0 0 1px var(--line2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);padding:4px 9px}
#dock{display:flex;align-items:center;gap:8px;width:calc(100% + 32px);margin:0 -16px;padding:9px 16px;border:0;border-top:1px solid var(--line);background:none;font-size:13px;text-align:left}
#dock[hidden]{display:none}
#dock b{font-weight:700}
#dock .dt{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
#dock .dc{margin-left:auto;font-size:19px;font-weight:600;line-height:1}
#dock::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink3);border-top:1.6px solid var(--ink3);transform:rotate(45deg)}
#dock:active{background:var(--fill)}
.dc.soon,.cd.soon{color:var(--warn)}.dc.now,.cd.now{color:var(--hit)}

/* ---- 下のタブ */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav button{flex:1;border:0;background:none;color:var(--ink3);font-size:10.5px;font-weight:600;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:color .15s}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:2px;background:var(--ink);border-radius:0 0 2px 2px;transform:translateX(-50%);transition:width .22s cubic-bezier(.2,.7,.2,1)}
nav button.on::before{width:36px}
nav button:active svg{transform:scale(.9)}

/* ---- 本文 */
main{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
#sample{margin:0;padding:8px 16px 0;font-size:11.5px;color:var(--ink3);line-height:1.5}
.sec{background:var(--sf);border-block:1px solid var(--line);padding:0 16px;margin:8px 0 0}
.eb{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.05em;white-space:nowrap}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:13px 0 9px}
.sech .eb{font-size:12px;color:var(--ink2);letter-spacing:.02em}
.sech .dim{font-size:11px;color:var(--ink3);font-weight:400}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:8px 0 12px}
.msg{font-size:13px;color:var(--ink2);padding:12px 0;border-top:1px solid var(--line)}
.msg b{font-weight:700;color:var(--ink)}
.msg .sub2{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}

/* モデルの実績（横にめくる札） */
.pwrap{padding-top:10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 6px}
.perf{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.perf::-webkit-scrollbar{display:none}
.pt{flex:0 0 auto;min-width:118px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:9px 12px 10px;scroll-snap-align:start}
.pt .l{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pt .v{font:600 26px/1 var(--num);margin-top:6px;letter-spacing:0}
.pt .v small{font:500 10px/1 var(--txt);color:var(--ink3);margin-left:4px;letter-spacing:.04em}
.pt .s{font-size:10.5px;color:var(--ink3);margin-top:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pt .s b{font-weight:700;color:var(--ink2)}.pt .s b.up{color:var(--hit)}

/* 今日ここまで */
.tstrip{display:flex;align-items:center;gap:14px;padding:11px 0}
.tstrip .ts{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.tstrip .ts b{font:600 17px/1 var(--num)}
.tstrip .ts em{font-style:normal;font-size:11px;color:var(--ink3)}

/* 次のレース */
.hero{padding-top:14px;position:relative}
.prog{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width 1s linear}
.hh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px}
.rt{margin:3px 0 4px;font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:baseline;gap:7px}
.rt .n{font-size:34px;font-weight:600;line-height:.9}
.rt .n small{font-size:21px;font-weight:600;margin-left:1px}
.meta{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.cdw{text-align:right;flex:0 0 auto}
.cd{font:600 46px/.95 var(--num);margin-top:4px;min-width:2.3em}

/* 状態の札 */
.st{display:inline-flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink3)}
.st.buy{color:var(--go);background:var(--gobg);padding:3px 9px;border-radius:999px}
.st.hit{color:var(--hit);background:var(--hitbg);padding:3px 9px;border-radius:999px}
.sk{font-size:10px;font-weight:600;color:var(--warn);background:var(--warnbg);padding:2px 5px;border-radius:4px;margin-left:5px;letter-spacing:.04em}
.hm{font-style:normal;font-size:10px;font-weight:700;color:var(--hit);margin-left:5px;white-space:nowrap}
.pm{font-weight:700;font-variant-numeric:tabular-nums}.pm.up{color:var(--hit)}

/* 馬番・組番 */
.no{display:inline-grid;place-items:center;min-width:27px;height:27px;padding:0 4px;border-radius:7px;font:600 17px/1 var(--num);font-style:normal;background:var(--sf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);font-variant-numeric:tabular-nums}
.no.on{background:var(--ink);color:var(--inv);box-shadow:none}
.no.hitc{background:var(--hit);color:#fff;box-shadow:none}
.kc{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.kc i{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 3px;border-radius:6px;font:600 15px/1 var(--num);font-style:normal;background:var(--sf);box-shadow:inset 0 0 0 1px var(--line2);font-variant-numeric:tabular-nums}
.kc.ord{gap:0}
.kc.ord i+i{margin-left:12px;position:relative}
.kc.ord i+i::before{content:"";position:absolute;left:-9px;top:50%;width:4px;height:4px;border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);transform:translateY(-50%) rotate(45deg)}
.kc.hit i{background:var(--hit);color:#fff;box-shadow:none}
.x{color:var(--ink3);font-size:11px;margin:0 1px}

/* 買い目の行（左の欄＝券種、中＝中身、右＝点数や結果） */
.slip{border-top:1px solid var(--line)}
.slip>summary,.slip>.sum{display:grid;grid-template-columns:54px minmax(0,1fr) auto 12px;align-items:center;column-gap:10px;padding:11px 0;min-height:50px;list-style:none;cursor:pointer}
.slip>.sum{grid-template-columns:54px minmax(0,1fr) auto;cursor:default}
summary::-webkit-details-marker{display:none}
.slip>summary::after,.info>summary::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:translateY(-2px) rotate(45deg);transition:transform .22s;justify-self:center}
.slip[open]>summary::after,.info[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.slip>summary:active{opacity:.6}
.sl{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--ink)}
.sl small{display:block;font-size:10px;font-weight:600;color:var(--ink3);margin-top:1px}
.sm{min-width:0;display:flex;align-items:center;gap:5px 6px;flex-wrap:wrap;font-size:13px}
.sm .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.sm .mu,.mu{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.sa{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sb{padding:0 0 14px}
.sb>.cap{font-size:11px;font-weight:600;color:var(--ink3);margin:12px 0 2px}
.pass{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px solid var(--line);padding:11px 0;font-size:12px;color:var(--ink3)}
.pass span{background:var(--fill);border-radius:5px;padding:2px 7px;font-size:11px}

/* 馬の行 */
.hr{display:grid;grid-template-columns:54px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:8px 0}
.hr+.hr{border-top:1px solid var(--line)}
.hn{font-size:15px;font-weight:600;line-height:1.3}
.hs{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:1px}
.ho{text-align:right;white-space:nowrap}.ho b{font:600 23px/1 var(--num)}.ho small{font-size:10.5px;color:var(--ink3);margin-left:2px}
.tg{display:inline-block;font-style:normal;font-size:10.5px;font-weight:600;line-height:1;padding:3px 6px;border-radius:5px;background:var(--fill);color:var(--ink2);white-space:nowrap;vertical-align:1.5px;margin-right:5px}
.tg.hit{background:var(--hitbg);color:var(--hit)}
.tg.go{background:var(--gobg);color:var(--go)}

/* 役の行（妙味ワイド） */
.role{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:10px;padding:8px 0}
.role+.role{border-top:1px solid var(--line)}
.role .rk{font-size:11px;font-weight:700;color:var(--ink2);padding-top:5px}
.role .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.role .r1 b{font-size:14px;font-weight:600}
.role .r2{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.55}

/* 表 */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:500;color:var(--ink3);text-align:right;padding:7px 0 6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 0 7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child>td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.l,th.l{text-align:left}
tr.hitr td{color:var(--hit);font-weight:600}
table.sim{font-size:12px}table.sim td,table.sim th{padding:5px 0 5px 6px;white-space:nowrap}
table.sim td:first-child,table.sim th:first-child{padding-left:0}
.scroll{overflow-x:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.amt{display:inline-flex;align-items:center;gap:6px}
.lv{display:inline-flex;gap:2px;align-items:flex-end}
.lv u{width:3px;height:9px;border-radius:1px;background:var(--line2)}
.lv u:nth-child(1){height:5px}.lv u:nth-child(2){height:7px}
.lv u.on{background:var(--ink)}
.est{color:var(--ink3)}
.dn{color:var(--ink2)}.upc{color:var(--hit)}

/* くわしい中身・凡例 */
.info{border-top:1px solid var(--line)}
.info>summary{display:grid;grid-template-columns:minmax(0,1fr) 12px;align-items:center;column-gap:10px;padding:12px 0;font-size:12.5px;font-weight:600;color:var(--ink2);list-style:none;cursor:pointer}
.info>summary:active{opacity:.6}
.info .sb>.cap:first-child{margin-top:0}
dl.leg{margin:0;padding:0 0 14px;font-size:12px;line-height:1.65}dl.leg dt{font-weight:700;margin-top:10px}dl.leg dt:first-child{margin-top:0}dl.leg dd{margin:0;color:var(--ink2)}

/* 結果の小さな帯（レースの中） */
.res{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.res .w{display:flex;align-items:center;gap:6px;font-weight:600}
.res .r{margin-left:auto;color:var(--ink2);text-align:right}

/* 今日のレース一覧 */
.chips{position:sticky;top:var(--hh);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:9px 16px;margin:8px 0 -8px;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:none;box-shadow:inset 0 0 0 1px var(--line2);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);padding:6px 14px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--inv);box-shadow:none}
.chips button:active{opacity:.6}
.rw{border-top:1px solid var(--line)}.rw:first-of-type{border-top:0}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:11px 0;min-height:58px;list-style:none;cursor:pointer}
.rrow:active{opacity:.6}
.rno{font:600 23px/1 var(--num)}
.rno small{font-size:15px;margin-left:1px}
.rno span{display:block;font:500 11px/1 var(--txt);color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:0}
.rmid{min-width:0}
.rmid .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:4px;align-items:center}
.rmid .t:empty+.tags,.rmid .tags:first-child{margin-top:0}
.tags .tg{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.tags .tg b{font-weight:700;color:var(--ink)}
.tags .tg.hit b{color:var(--hit)}
.tags .pl{font-size:11px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.rw.nx>.rrow .rno{color:var(--go)}
.rw.nx{box-shadow:inset 3px 0 0 var(--go);margin:0 -16px;padding:0 16px}
.rw.past>.rrow .rno{color:var(--ink3)}
.rd{background:var(--bg);margin:0 -16px;padding:0 16px 4px;border-top:1px solid var(--line)}
.rd>:first-child{border-top:0}

/* 結果タブ */
.rr{padding:12px 0;border-top:1px solid var(--line)}.sech+.rr,.note+.rr{border-top:0;padding-top:2px}
.rr1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rl{font-size:14px;font-weight:600}
.rl small{font-size:11.5px;font-weight:400;color:var(--ink3);margin-left:7px;font-variant-numeric:tabular-nums}
.rr1 .pm{font:600 21px/1 var(--num)}
.rr1 .pm small{font:500 11px/1 var(--txt);margin-left:1px}
.rr2{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}
.rr2 b{font-weight:700;color:var(--ink2)}
.bar{position:relative;height:4px;border-radius:2px;background:var(--fill);margin-top:8px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ink3);max-width:100%}
.bar.up i{background:var(--hit)}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink2)}

/* 点検の結果 */
#sos{margin:0;background:var(--sf);border-bottom:1px solid var(--line);padding:12px 16px;font-size:13px;line-height:1.55;position:relative}
#sos .it{padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}#sos .it:first-of-type{margin-top:8px}
#sos .ng{color:var(--hit);font-weight:700}#sos .ok{color:var(--go);font-weight:700}
#sos .xb{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--ink3);font-size:20px;width:36px;height:36px}

/* 読み込み中 */
.skel{height:86px;margin:8px 0 0;background:linear-gradient(90deg,var(--sf) 0%,var(--fill) 50%,var(--sf) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-block:1px solid var(--line)}
.skel.tall{height:230px}
@keyframes sh{to{background-position:-200% 0}}
@keyframes blink{50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#view.enter>*{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.03s}#view.enter>*:nth-child(3){animation-delay:.06s}#view.enter>*:nth-child(4){animation-delay:.09s}#view.enter>*:nth-child(n+5){animation-delay:.12s}
@supports (interpolate-size:allow-keywords){
  :root{interpolate-size:allow-keywords}
  details::details-content{block-size:0;overflow-y:clip;transition:block-size .26s cubic-bezier(.2,.7,.2,1),content-visibility .26s allow-discrete}
  details[open]::details-content{block-size:auto}
  #view.still details::details-content{transition:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@media (min-width:592px){.sec,.chips,.skel{border-inline:1px solid var(--line)}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="h1"><h1 class="logo">musu<small>競馬予想</small></h1>
    <div class="seg" role="tablist"><button data-src="jra">中央</button><button data-src="nar">地方</button></div>
    <button class="ib" id="themeb" aria-label="明るい表示と暗い表示を切り替える"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg></button></div>
  <div class="h2"><button id="meta" aria-label="いますぐ読み込み直す"><i class="live spin"></i>読み込み中…</button><button class="sosb" id="sosb">点検</button></div>
  <button id="dock" hidden></button>
</div></header>
<div id="sos" class="wrap" hidden></div>
<main class="wrap"><p id="sample" hidden></p><div id="view"><div class="skel"></div><div class="skel tall"></div><div class="skel"></div></div></main>
<nav><div class="wrap">
  <button data-tab="next"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.2"/><path d="M12 9.8v3.7l2.4 1.5M9.6 3.4h4.8"/></svg>次のレース</button>
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M9 6.5h10.5M9 12h10.5M9 17.5h10.5"/><path d="M4.6 6.5h.01M4.6 12h.01M4.6 17.5h.01" stroke-width="2.4"/></svg>今日のレース</button>
  <button data-tab="result"><svg viewBox="0 0 24 24"><path d="M5.5 19.5v-6M12 19.5v-15M18.5 19.5v-9.5"/></svg>結果</button>
</div></nav>
<script>
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let D = null, H = [], tab = LS.get("tab") || "next", venue = null, src = LS.get("src") || "jra";
if (!["next", "today", "result"].includes(tab)) tab = "next";
const lbl = () => D.decision_label || `締切${D.decision_min}分前`;
const $ = s => document.querySelector(s);
const num = v => (v ?? 0).toLocaleString("ja-JP");
const yen = v => num(v) + "円";
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pm = v => `<b class="pm${v > 0 ? " up" : ""}">${v > 0 ? "+" : v < 0 ? "−" : ""}${num(Math.abs(v))}<small>円</small></b>`;   // 収支（プラスだけ赤）

function now() { return D && D.now_override ? new Date(D.now_override) : new Date(); }
function t(hm) { const [h, m] = hm.split(":").map(Number); const d = new Date(D.date + "T00:00:00+09:00"); d.setHours(h, m, 0, 0); return d; }
function upcoming() { const n = now(); return D.races.filter(r => r.state !== "out" && t(r.post) > n).sort((a, b) => t(a.post) - t(b.post)); }

// 単勝の型（1=合格版、2=拡大版、3=広め）。画面は広めまで全部出して札で区別する。mode は集計のときだけ切り替える
let mode = "3";
const TIERTAG = { 2: "拡大", 3: "広め", 4: "馬主モデルのみ" };
// 単勝の買い: 標準＝合格モデルの買い＋馬主モデルだけの買い（tier 4）。拡大・広めはさらに tier 2・3 を足す
function buysOf(r) {   // 同じ馬が「拡大」と「馬主モデルのみ」の両方に入っていても1頭として数える
  const ex = r.buys_ext || [], seen = new Set();
  return r.buys.concat(ex.filter(b => b.tier === 4 || (mode !== "1" && b.tier <= +mode))).filter(b => !seen.has(b.no) && seen.add(b.no));
}
function retOf(r) { if (!r.result) return 0; const w = new Set(r.result.first); return buysOf(r).filter(b => w.has(b.no)).length * (r.result.tan || 0); }

// ---------- 部品
function kc(kumi, hit) {   // 組番を札にする（→ は着順どおり、- は順不同）
  const s = String(kumi), ord = s.includes("→"), parts = s.split(ord ? "→" : "-");
  return `<span class="kc${ord ? " ord" : ""}${hit ? " hit" : ""}">${parts.map(p => `<i>${esc(p.trim())}</i>`).join("")}</span>`;
}
const hm = '<em class="hm">的中</em>';
function amt(a) { const k = Math.min(3, Math.round(a / 100)); return `<span class="amt"><span class="lv">${[1, 2, 3].map(i => `<u${i <= k ? ' class="on"' : ""}></u>`).join("")}</span>${yen(a)}</span>`; }   // 金額の濃淡
function fmtO(b) { const o = b.odds; if (o == null) return b.est ? `<span class="est">推定 ${Math.round(b.est)}</span>` : "—"; return Array.isArray(o) ? `${o[0]}〜${o[1]}` : `${o}`; }
function sk(r) { return r.result && r.result.src === "速報" ? '<span class="sk">速報</span>' : ""; }
function resBadge(res, hitTxt, pre) { return res ? (res.ret ? `<span class="st hit">${hitTxt || "的中"} ${yen(res.ret)}</span>` : `<span class="st">外れ</span>`) : pre; }

function status(r) {
  if (r.state === "out") return ["対象外", ""];
  const bs = buysOf(r);
  if (r.result && r.state === "decided") { const [a_, b_] = bs.length ? (retOf(r) > 0 ? ["単勝 的中", "hit"] : ["単勝 外れ", ""]) : ["単勝 見送り", ""]; return [a_ + sk(r), b_]; }
  if (r.state === "missed") return ["単勝 判定なし", ""];
  if (r.state === "decided") return bs.length ? [`単勝 ${bs.length}頭`, "buy"] : ["単勝 見送り", ""];
  return ["予想前", ""];
}

// ---------- モデルの実績: 過去（バックテスト）と本番の通算（history）
function perfStrip() {
  const sumH = f => { let sp = 0, rt = 0, d = 0; H.forEach(h => { const x = f(h); if (x && x.spent) { sp += x.spent; rt += x.ret; d++; } }); return sp ? { p: Math.round(rt / sp * 100), d, diff: rt - sp } : null; };
  const L = src === "nar" ? [
    ["単勝 標準", "141%", h => ({ spent: h.spent, ret: h.ret })],
    ["単勝 拡大まで", "118%", h => h.ext && h.ext["2"]],
    ["単勝 広めまで", "113%", h => h.ext && h.ext["3"]],
    ["妙味ワイド", "110%", h => h.myomi],
    ["3連単 中穴", "122%", h => h.tri],
    ["3連単 大穴", "141%", h => h.tria],
    ["3連複", "120%", h => h.trio]] : [
    ["単勝 標準", "134%", h => (h.ext && h.ext["4"] && h.ext["4"].spent) ? h.ext["4"] : { spent: h.spent, ret: h.ret }],
    ["単勝 拡大まで", "117%", h => h.ext && h.ext["2"]],
    ["単勝 広めまで", "105%", h => h.ext && h.ext["3"]],
    ["3連単（試験）", "108%", h => h.tri],
    ["3連複（試験）", "112%", h => h.trio],
    ["単勝の馬1着の3連単", "144%", h => h.axis && h.axis["2"]],
    ["参考の組合せ", "—", h => h.exo]];
  return `<div class="pwrap"><div class="ph"><span class="eb">モデルの実績（${src === "nar" ? "地方" : "中央"}）</span><span class="eb" style="font-weight:400;letter-spacing:0">過去の回収率と、本番の通算</span></div>
    <div class="perf" id="perf">${L.map(([nm, b, f]) => { const s = sumH(f);
      return `<div class="pt"><div class="l">${nm}</div><div class="v">${b}${b === "—" ? "" : "<small>過去</small>"}</div>
        <div class="s">${s ? `本番 <b${s.p >= 100 ? ' class="up"' : ""}>${s.p}%</b>　${s.d}日 ${s.diff >= 0 ? "+" : "−"}${yen(Math.abs(s.diff))}` : "本番 まだなし"}</div></div>`; }).join("")}</div></div>`;
}

// ---------- レースの中身
function horseRows(list, withEv, win, on) {
  return list.map(h => `<div class="hr"><div><i class="no${on ? " on" : ""}${win && win.has(h.no) ? " hitc" : ""}">${h.no}</i></div>
    <div><div class="hn">${h.both === true ? `<i class="tg hit">★両方</i>` : h.both === false ? `<i class="tg">合格モデルのみ</i>` : ""}${h.tier ? `<i class="tg">${TIERTAG[h.tier]}</i>` : ""}${esc(h.name)}${win && win.has(h.no) ? hm : ""}</div>
      <div class="hs">勝率 ${pct(h.p)}${withEv ? ` ・ 期待値 ${h.ev.toFixed(2)}` : ` ・ 必要オッズ ${h.need.toFixed(1)}倍`}</div></div>
    <div class="ho"><b>${h.odds.toFixed(1)}</b><small>倍</small></div></div>`).join("");
}

function tanBox(r, skip) {   // 単勝（合格モデル。各100円・札なし＝標準、札＝拡大・広め）
  const bs = buysOf(r);
  if (!bs.length) { if (r.note) return `<div class="msg">単勝：予想できませんでした（${esc(r.note)}）</div>`; skip.push("単勝"); return ""; }
  const win = r.result ? new Set(r.result.first) : null, ret = retOf(r);
  const aside = r.result ? (ret > 0 ? `<span class="st hit">的中 ${yen(ret)}</span>` : `<span class="st">外れ</span>`) : `${bs.length}頭 ${yen(100 * bs.length)}`;
  return `<div class="slip"><div class="sum"><span class="sl">単勝<small>各100円</small></span><span class="sm"><span class="mu">${bs.some(b => b.tier) ? "札なし＝標準、札＝拡大・広め" : "買う馬"}</span></span><span class="sa">${aside}</span></div>
    <div class="sb" style="padding-bottom:6px">${horseRows(bs, true, win, true)}${bs.some(b => b.both !== undefined || b.tier === 4) ? `<div class="note" style="padding-bottom:6px">★両方＝合格モデルと馬主モデルの両方が「買い」（いちばん信頼できる）。「〜のみ」は片方だけが「買い」。</div>` : ""}</div></div>`;
}

function myomiBox(r) {   // 妙味ワイド（地方・試験中）: 買われ足りない人気馬を軸に、誰も見ていない穴へ。買われすぎの人気馬は切る
  const m = r.myomi; if (!m) return "";
  const res = r.myomi_res, hit = new Set(res ? res.hits : []);
  const badge = resBadge(res, "", `${m.bets.length}点 ${yen(m.total)}`);
  const hl = (h, tag, note) => `<div class="role"><div class="rk">${tag}</div><div><div class="r1"><i class="no">${h.no}</i><b>${esc(h.name)}</b><span class="mu">${h.ninki}番人気・${h.odds.toFixed(1)}倍</span></div>
    <div class="r2">${note}${h.why && h.why.length ? `<br>根拠　${h.why.map(esc).join("／")}` : ""}</div></div></div>`;
  const TN = { wide: "ワイド", umaren: "馬連" };
  return `<details class="slip" data-k="${r.id}:myomi"><summary><span class="sl">妙味<small>ワイド</small></span>
      <span class="sm"><span class="mu">軸</span><i class="no">${m.axis.no}</i><span class="x">×</span><span class="mu">穴</span>${m.ana.map(h => `<i class="no">${h.no}</i>`).join("")}</span><span class="sa">${badge}</span></summary>
    <div class="sb">
      ${hl(m.axis, "軸", `人気だが買われ足りない　世間の ${m.axis.r.toFixed(2)} 倍`)}
      ${m.ana.map(h => hl(h, "穴", `人気薄　モデルは世間の ${h.r.toFixed(2)} 倍`)).join("")}
      ${m.ate ? hl(m.ate, "当て役", "的中を拾う1点（単独では1割負け）") : ""}
      ${m.cut.map(h => hl(h, "消し", `買われすぎ　世間の ${h.r.toFixed(2)} 倍`)).join("")}
      <div class="cap">買い目</div>
      <table><tr><th>券種</th><th class="l">組</th><th>役</th><th>オッズ</th><th>金額</th></tr>${m.bets.map(b => { const h_ = hit.has(b.type + " " + b.kumi);
        return `<tr${h_ ? ' class="hitr"' : ""}><td>${TN[b.type]}</td><td class="l">${kc(b.kumi, h_)}${h_ ? hm : ""}</td><td>${b.role}</td><td>${fmtO(b)}</td><td>${amt(b.amt)}</td></tr>`; }).join("")}</table>
    </div></details>`;
}

function triOn() { return src === "nar" || (D && D.races.some(x => x.tri)); }   // その日に3連単・3連複の計算が動いているか
function betTable(list, hit) {
  return `<table><tr><th>組</th><th>見立て</th><th>オッズ</th><th>金額</th></tr>${list.map(b => { const h_ = hit.has(b.kumi);
    return `<tr${h_ ? ' class="hitr"' : ""}><td>${kc(b.kumi, h_)}${h_ ? hm : ""}</td><td>${(b.p * 100).toFixed(1)}%</td><td>${fmtO(b)}</td><td>${amt(b.amt)}</td></tr>`; }).join("")}</table>`;
}

function trioBox(r, skip) {   // 3連複（試験中）: 3連単と同じ並び確率を6通り足したもの × 推定オッズ
  const v = r.tri; if (!v || !(v.trio || []).length) { if (r.state === "decided" && triOn()) skip.push("3連複"); return ""; }
  const res = r.trio_res, hit = new Set(res ? res.hits : []);
  return `<details class="slip" data-k="${r.id}:trio"><summary><span class="sl">3連複</span>
      <span class="sm">${kc(v.trio[0].kumi, hit.has(v.trio[0].kumi))}${v.trio.length > 1 ? `<span class="mu">ほか</span>` : ""}</span><span class="sa">${resBadge(res, "", `${v.trio.length}点 ${yen(v.trio_total)}`)}</span></summary>
    <div class="sb">${betTable(v.trio, hit)}</div></details>`;
}

function triBox(r, ana, skip) {   // 3連単（試験中）: 1着は勝率、2・3着は「滑り込む力」で直した並び確率 × 推定オッズ。大穴＝1着を単勝の穴馬に固定（地方）
  const name = ana ? "3連単 大穴" : src === "nar" ? "3連単 中穴" : "3連単", v0 = r.tri;
  const pass = () => { if (r.state === "decided" && triOn()) skip.push(name); return ""; };
  if (!v0) return pass();
  const v = ana ? { bets: v0.ana || [], total: v0.ana_total || 0, horses: v0.horses } : v0; if (!v.bets.length) return pass();
  const res = ana ? r.tria_res : r.tri_res, hit = new Set(res ? res.hits : []);
  const hs = (v.horses || []).map(h => `<tr><td><b>${h.no}</b>　${esc(h.name || "")}</td><td>${h.ninki}</td><td><b>${pct(h.t3)}</b></td><td>${pct(h.t3m)}</td></tr>`).join("");
  return `<details class="slip" data-k="${r.id}:tri${ana ? "a" : ""}"><summary><span class="sl">3連単${ana ? "<small>大穴</small>" : src === "nar" ? "<small>中穴</small>" : ""}</span>
      <span class="sm">${kc(v.bets[0].kumi, hit.has(v.bets[0].kumi))}${v.bets.length > 1 ? `<span class="mu">ほか</span>` : ""}</span><span class="sa">${resBadge(res, "", `${v.bets.length}点 ${yen(v.total)}`)}</span></summary>
    <div class="sb">${betTable(v.bets, hit)}
      ${hs ? `<div class="cap">使った馬の3着内（モデル／世間）</div><table class="sim"><tr><th>馬</th><th>人気</th><th>モデル</th><th>世間</th></tr>${hs}</table>` : ""}</div></details>`;
}

function axisBox(r) {   // 単勝の買い馬を1着に固定した3連単（検証中）
  const list = (r.axis || {})[mode] || [], res = (r.axis_res || {})[mode];
  if (!list.length) return "";
  const hit = new Set(res ? res.hits : []);
  return `<details class="slip" data-k="${r.id}:axis"><summary><span class="sl">3連単<small>1着固定</small></span>
      <span class="sm">${kc(list[0].kumi, hit.has(list[0].type + list[0].kumi))}${list.length > 1 ? `<span class="mu">ほか</span>` : ""}</span><span class="sa">${resBadge(res, "", `${list.length}点 ${yen(100 * list.length)}`)}</span></summary>
    <div class="sb"><table><tr><th>組</th><th>オッズ</th><th>期待値</th></tr>${list.map(e => { const h_ = hit.has(e.type + e.kumi);
      return `<tr${h_ ? ' class="hitr"' : ""}><td>${kc(e.kumi, h_)}${h_ ? hm : ""}</td><td>${e.odds ? e.odds.toFixed(1) : "—"}</td><td>${e.ev.toFixed(2)}</td></tr>`; }).join("")}</table></div></details>`;
}

function paceBox(r) {   // 展開: 位置取りと、ペース・枠の有利不利で動く馬だけ（決着の順位づけ・「10万回」の表は 2026-11-14 に外した）
  const v = r.pace; if (!v) return "";
  const lab2 = { high: "ハイペース", slow: "スロー", inner: "内が有利", outer: "外が有利" };
  const cell = (h, up) => h ? `<b>${h.no}</b>　${esc(h.name || "")}<div class="mu" style="font-size:10.5px">3着内 ${pct(h.t3)}（<span class="${up ? "upc" : "dn"}">${up ? "+" : ""}${(h.diff * 100).toFixed(0)}pt</span>）</div>` : `<span class="mu">—</span>`;
  const sc_ = v.scen || {};
  const sr = Object.keys(lab2).filter(k => sc_[k] && (sc_[k].diff > 0.02 || sc_[k].down))
    .map(k => `<tr><td style="white-space:nowrap">${lab2[k]}</td><td class="l" style="white-space:normal">${sc_[k].diff > 0.02 ? cell(sc_[k], true) : cell(null)}</td><td class="l" style="white-space:normal">${cell(sc_[k].down, false)}</td></tr>`).join("");
  let today = "";
  if (v.today) {
    const t_ = v.today, words = [];
    if (t_.front === "front") words.push("前に行った馬が残っている");
    if (t_.front === "back") words.push("後ろからの差しが決まっている");
    if (t_.gate === "inner") words.push("内枠が来ている");
    if (t_.gate === "outer") words.push("外枠が来ている");
    const pk = t_.pick && sc_[t_.pick];
    today = words.length
      ? `<div class="msg"><b>今日の馬場　${words.join("・")}</b>${pk ? `<br>この馬場なら <b>${pk.no}番 ${esc(pk.name)}</b>（3着以内 ${pct(pk.t3)}）` : ""}<span class="sub2">この場の前の${t_.n}レースから自動で判断（同じ傾向が続くのは6割ほど）</span></div>`
      : `<div class="msg" style="color:var(--ink3)">今日の馬場　${t_.n ? "はっきりした偏りはまだ見えない" : "この場の最初のレースなので、まだ分からない"}</div>`;
  }
  const nos = l => (l || []).map(h => `<i class="no">${h.no}</i>`).join("");
  const pos = v.front && v.front.length ? `<span class="mu">前</span>${nos(v.front)}${(v.back || []).length ? `<span class="mu" style="margin-left:6px">後ろ</span>${nos(v.back)}` : ""}` : "";
  if (!pos && !sr) return today;
  const head = `<span class="sl">展開</span><span class="sm">${pos || `<span class="mu">ペース・枠で動く馬</span>`}</span><span class="sa"></span>`;
  if (!sr) return `${today}<div class="slip"><div class="sum">${head}</div></div>`;
  return `${today}
    <details class="slip" data-k="${r.id}:pace"><summary>${head}</summary>
    <div class="sb"><div class="cap" style="margin-top:0">ペースや枠が偏ったら（3着以内の確率の変化）</div>
      <table class="sim" style="table-layout:fixed"><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup><tr><th>もしも〜なら</th><th class="l">浮く馬</th><th class="l">沈む人気馬</th></tr>${sr}</table>
    </div></details>`;
}

function resLine(r) {   // レースの結果（1着と単勝の払戻）
  if (!r.result) return "";
  const bs = buysOf(r);
  return `<div class="res"><span class="eb">結果</span>${sk(r)}<span class="w">1着 ${r.result.first.map(x => `<i class="no">${x}</i>`).join("")} ${esc(r.result.first_name || "")}</span>
    <span class="r">${r.result.tan ? `単勝 ${yen(r.result.tan)}（${(r.result.tan / 100).toFixed(1)}倍）` : ""}${bs.length ? `${r.result.tan ? "<br>" : ""}単勝の収支 ${pm(retOf(r) - 100 * bs.length)}` : ""}</span></div>`;
}

function raceDetail(r) {
  let html = resLine(r);
  if (r.state === "out" || r.state === "missed") {
    html += `<div class="msg" style="color:var(--ink3)">${esc(r.note || "予想の対象外")}</div>`;
  } else if (r.state === "decided" || r.result) {
    const skip = [];
    html += tanBox(r, skip) + myomiBox(r) + triBox(r, false, skip) + (src === "nar" && r.tri && (r.tri.ana || []).length ? triBox(r, true, skip) : "") + trioBox(r, skip) + axisBox(r);
    if (skip.length) html += `<div class="pass">見送り${skip.map(x => `<span>${x}</span>`).join("")}</div>`;
    html += paceBox(r);
    let more = "";
    if (r.top && r.top.length) more += `<div class="cap">勝率の高い順</div>${horseRows(r.top, false)}`;
    if (r.exo && r.exo.length) more += `<div class="cap">参考：組合せ馬券（検証中・記録用）</div>
      <table><tr><th>券種</th><th class="l">組</th><th>オッズ</th><th>期待値</th></tr>${r.exo.map(e => { const h_ = r.exo_res && r.exo_res.hits.includes(e.type + " " + e.kumi);
        return `<tr${h_ ? ' class="hitr"' : ""}><td>${esc(e.type)}</td><td class="l">${kc(e.kumi, h_)}${h_ ? hm : ""}</td><td>${e.odds.toFixed(1)}</td><td>${e.ev.toFixed(2)}</td></tr>`; }).join("")}</table>`;
    more += `<div class="note" style="padding-bottom:0">${D.rule_note ? esc(D.rule_note) : `オッズは判定時（締切${D.decision_min}分前）の値。単勝の買う条件: 10〜50倍 かつ 期待値1.15以上。`}</div>`;
    html += `<details class="info" data-k="${r.id}:more"><summary>くわしい数字（勝率の順・参考の組合せ）</summary><div class="sb">${more}</div></details>`;
  } else {
    html += `<div class="msg">予想は <b>${r.decide}</b> ごろ（${lbl()}）に出ます</div>`;
  }
  return html;
}

// ---------- 次のレース
function scoreBar() {   // 今日ここまでの当たり（結果が1つも無ければ出さない）
  const bets = D.races.filter(r => r.result && r.state === "decided" && buysOf(r).length);
  const parts = [];
  if (bets.length) { const sp = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), rt = bets.reduce((a, r) => a + retOf(r), 0);
    parts.push(`<span class="ts">単勝 <b>${bets.filter(r => retOf(r) > 0).length}/${bets.length}</b> ${pm(rt - sp)}</span>`); }
  if (!parts.length) return "";
  return `<section class="sec"><div class="tstrip scroll"><span class="eb">今日ここまで</span>${parts.join("")}</div></section>`;
}

function win5Box() {   // WIN5（試験中）: 対象5レース、買い目（フォーメーション）、結果
  const w = D.win5; if (!w || src !== "jra") return "";
  const R_ = id => D.races.find(r => r.id === id) || {};
  const nm = id => { const r = R_(id); return r.venue ? `${esc(r.venue)}${r.R}R` : id.slice(-4); };
  let body = "", aside = `<span class="mu">${w.legs.length}レース</span>`;
  if (w.note) body = `<div class="msg" style="border-top:0;padding-top:0">${esc(w.note)}</div>`;
  else if (w.pending) body = `<div class="msg" style="border-top:0;padding-top:0">対象　${w.legs.map(nm).join("・")}<span class="sub2">買い目は1レース目（${nm(w.legs[0])}）の発走10分前に出します。</span></div>`;
  else {
    const ff = w.forms || [];
    const head = `<tr><th>レース</th>${ff.map((f, i) => `<th class="l">買い目${i + 1}</th>`).join("")}</tr>`;
    const rows = w.legs.map((id, k) => { const win = R_(id).result ? new Set(R_(id).result.first) : null;
      return `<tr><td>${k + 1}. ${nm(id)}</td>${ff.map(f => `<td class="l" style="white-space:normal">${f[k].map(n => win && win.has(n) ? `<b class="upc">${n}</b>` : n).join("・")}</td>`).join("")}</tr>`; }).join("");
    const pts = ff.map(f => f.reduce((a, s) => a * s.length, 1));
    aside = w.res ? (w.res.hit ? `<span class="st hit">的中 ${yen(w.res.pay)}</span>` : `<span class="st">外れ</span>`) : `${w.pts}点 ${yen(100 * w.pts)}`;
    body = `<div class="mu" style="padding-bottom:6px">合計 ${w.pts}点（${yen(100 * w.pts)}）・${w.at}判定　対象 ${w.legs.map(nm).join("・")}</div>
      <div class="scroll"><table class="sim">${head}${rows}<tr><td class="mu">点数</td>${pts.map(p => `<td class="l mu">${p}点</td>`).join("")}</tr></table></div>
      <div class="note" style="padding-bottom:0">即PATの「フォーメーション」で、買い目ごとに各レースの馬を選んで入れます（買い目どうしの重なりは合計から除いています）。少なく買うなら買い目1から順に。</div>
      ${(w.top || []).length ? `<details class="info" data-k="w5top" style="margin-top:10px"><summary>期待値の高い組（上位${w.top.length}）</summary><div class="sb"><table class="sim"><tr><th>順</th><th class="l">組</th><th>起きる確率</th></tr>${w.top.map((x, i) => `<tr><td>${i + 1}</td><td class="l">${kc(x.kumi.join("-"))}</td><td>${(x.p * 100).toFixed(3)}%</td></tr>`).join("")}</table></div></details>` : ""}`;
  }
  return `<section class="sec"><details class="slip" data-k="w5"${w.pending || w.note ? "" : " open"} style="border-top:0"><summary><span class="sl">WIN5<small>試験中</small></span><span class="sm"><span class="mu">${w.pending || w.note ? "準備中" : "買い目あり"}</span></span><span class="sa">${aside}</span></summary><div class="sb">${body}</div></details></section>`;
}

function viewNext() {
  const up = upcoming();
  if (!up.length) return scoreBar() + `<section class="sec hero"><div class="eb">今日のレース</div><h2 class="rt">本日終了</h2><div class="meta" style="padding-bottom:16px">結果は「結果」タブで見られます。</div></section>`;
  const r = up[0], [s, cls] = status(r);
  let html = scoreBar() + `<section class="sec hero"><div class="prog"><i id="prog"></i></div>
    <div class="hh"><div style="min-width:0"><div class="eb">次のレース</div><h2 class="rt">${esc(r.venue)}<span class="n">${r.R}<small>R</small></span></h2>
      <div class="meta">${r.name && r.name !== r.venue ? `<span>${esc(r.name)}</span>` : ""}<span>発走 ${r.post}</span><span>締切 ${r.close}</span>${s === "予想前" ? "" : `<span class="st ${cls}">${s}</span>`}</div></div>
      <div class="cdw"><div class="eb">発走まで</div><div class="cd n" id="cd" data-close="${t(r.post).toISOString()}"></div></div></div>
    ${raceDetail(r)}</section>` + win5Box();
  const after = up.slice(1, 4);
  if (after.length) html += `<section class="sec"><div class="sech"><span class="eb">このあとのレース</span></div>${after.map(x => rowHtml(x, true)).join("")}</section>`;
  return html;
}

// ---------- 今日のレース
function rowHtml(r, showVenue) {
  const [s, cls] = status(r), nx = D.__nx === r.id;
  const bs = (r.state === "decided") ? buysOf(r) : [];
  const tags = [], tg = (h, hit) => `<i class="tg${hit ? " hit" : ""}">${h}${hit ? " 的中" : ""}</i>`;
  if (bs.length) tags.push(tg(`単勝 <b>${bs.map(b => b.no).join("・")}</b>`, r.result && retOf(r) > 0));
  if (r.myomi) tags.push(tg(`妙味 <b>${r.myomi.axis.no}×${r.myomi.ana.map(h => h.no).join("・")}</b>`, r.myomi_res && r.myomi_res.ret));
  if (r.tri && r.tri.bets.length) tags.push(tg(`${src === "nar" ? "3連単中穴" : "3連単"} <b>${r.tri.bets.length}</b>点`, r.tri_res && r.tri_res.ret));
  if (r.tri && (r.tri.ana || []).length && src === "nar") tags.push(tg(`3連単大穴 <b>${r.tri.ana.length}</b>点`, r.tria_res && r.tria_res.ret));
  if (r.tri && (r.tri.trio || []).length) tags.push(tg(`3連複 <b>${r.tri.trio.length}</b>点`, r.trio_res && r.trio_res.ret));
  if (r.state === "decided" && triOn()) {
    const nb = r.tri ? r.tri.bets.length : 0, nt = r.tri ? (r.tri.trio || []).length : 0;
    if (!nb && !nt) tags.push(`<span class="pl">3連 見送り</span>`);
    else if (!nb) tags.push(`<span class="pl">3連単 見送り</span>`);
    else if (!nt) tags.push(`<span class="pl">3連複 見送り</span>`);
  }
  if (r.result) tags.push(`<span class="pl">1着 ${r.result.first.join("・")}番${r.result.tan ? ` ${(r.result.tan / 100).toFixed(1)}倍` : ""}</span>`);
  const title = `${showVenue ? esc(r.venue) + " " : ""}${esc(r.name && r.name !== r.venue ? r.name : "")}`.trim();
  return `<details class="rw${nx ? " nx" : ""}${r.result ? " past" : ""}" data-k="r${r.id}"${nx ? ' id="nextrow"' : ""}><summary class="rrow"><div class="rno">${r.R}<small>R</small><span>${r.post}</span></div>
    <div class="rmid">${title ? `<div class="t">${title}</div>` : ""}${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}</div>
    ${s === "予想前" ? `<span class="st">予想 ${r.decide}</span>` : `<span class="st ${cls}">${s}</span>`}</summary><div class="rd">${raceDetail(r)}</div></details>`;
}

function viewToday() {
  const venues = [...new Set(D.races.map(r => r.venue))];
  if (!venue || !venues.includes(venue)) { const nx = upcoming()[0]; venue = nx ? nx.venue : venues[0]; }
  const chips = `<div class="chips">${venues.map(v => `<button data-v="${esc(v)}" class="${v === venue ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
  const list = D.races.filter(r => r.venue === venue).sort((a, b) => a.R - b.R);
  return win5Box() + chips + `<section class="sec">${list.map(r => rowHtml(r, false)).join("")}</section>`;
}

// ---------- 結果
function resRow(x) {   // x: { l=名前, hit="1/6", heads=頭数, spent, ret, text=お金以外の説明 }
  const hit = x.hit ? `<small>的中 ${x.hit}${x.heads ? `（${x.heads}頭）` : ""}</small>` : "";
  if (x.spent) { const roi = x.ret / x.spent * 100;
    return `<div class="rr"><div class="rr1"><span class="rl">${x.l}${hit}</span>${pm(x.ret - x.spent)}</div>
      <div class="rr2"><span>買い ${yen(x.spent)} → 払戻 ${yen(x.ret)}</span><span>回収率 <b>${roi.toFixed(0)}%</b></span></div>
      <div class="bar${roi >= 100 ? " up" : ""}"><i style="width:${Math.min(roi, 200) / 2}%"></i></div></div>`; }
  return `<div class="rr"><div class="rr1"><span class="rl">${x.l}${x.text ? hit : ""}</span></div><div class="rr2"><span>${x.text || "買いなし"}</span></div></div>`;
}

function viewResult() {
  // いちばん上に「今日のまとめ」（種類ごとに1行）、その下に通算、細かい表は押すと開く
  const done = D.races.filter(r => r.result && r.state === "decided");
  const pctS = (r_, s_) => s_ ? ((r_ / s_) * 100).toFixed(0) + "%" : "—";
  const sum = (list, f) => list.reduce((a, r) => a + f(r), 0);
  const rows = [];
  for (const [mm, lb] of [["1", "単勝 標準"], ["2", "単勝 拡大まで"], ["3", "単勝 広めまで"]]) {
    mode = mm;
    const bets = done.filter(r => buysOf(r).length);
    rows.push({ l: lb, hit: bets.length ? `${bets.filter(r => retOf(r) > 0).length}/${bets.length}` : "", heads: sum(bets, r => buysOf(r).length), spent: sum(bets, r => 100 * buysOf(r).length), ret: sum(bets, r => retOf(r)) });
  }
  mode = "3";
  const kind = (key, l) => { const z = D.races.filter(r => r[key] && r[key].bet); if (z.length) rows.push({ l, hit: `${z.filter(r => r[key].ret).length}/${z.length}`, spent: sum(z, r => r[key].bet), ret: sum(z, r => r[key].ret) }); };
  kind("tria_res", "3連単 大穴"); kind("tri_res", src === "nar" ? "3連単 中穴" : "3連単"); kind("trio_res", "3連複");
  const md = D.races.filter(r => r.myomi_res);
  if (md.length) rows.push({ l: "妙味ワイド", hit: `${md.filter(r => r.myomi_res.ret).length}/${md.length}`, spent: sum(md, r => r.myomi_res.bet), ret: sum(md, r => r.myomi_res.ret) });
  const xd = D.races.filter(r => r.axis_res && r.axis_res[mode] && r.axis_res[mode].bet);
  if (xd.length) rows.push({ l: "3連単（1着固定）", hit: `${xd.filter(r => r.axis_res[mode].ret).length}/${xd.length}`, spent: sum(xd, r => r.axis_res[mode].bet), ret: sum(xd, r => r.axis_res[mode].ret) });
  const ed = D.races.filter(r => r.exo_res && r.exo_res.bet);
  if (ed.length) rows.push({ l: "参考の組合せ", hit: `${ed.filter(r => r.exo_res.ret).length}/${ed.length}`, spent: sum(ed, r => r.exo_res.bet), ret: sum(ed, r => r.exo_res.ret) });
  if (src === "jra" && D.win5 && D.win5.res) { const w = D.win5.res; rows.push({ l: "WIN5", hit: w.hit ? "1/1" : "0/1", spent: w.bet, ret: w.pay }); }
  let html = `<section class="sec"><div class="sech"><span class="eb">今日 ${esc(D.date_ja)} のまとめ</span><span class="dim">結果が出た ${done.length}/${D.races.filter(r => r.state !== "out").length}レース</span></div>
    ${rows.map(resRow).join("")}
    <div class="note" style="border-top:1px solid var(--line)">各100円で買った場合（3連単・3連複・妙味ワイドは期待値で100〜300円）。的中＝当たったレース数／買ったレース数。回収率＝払戻÷買った額。棒のまん中の線が100%（元が戻る）。拡大・広めは試験中の買い方です。</div></section>`;
  // 地方: いちばん新しい前の日のまとめも出す（今日の分は速報で上に出る）
  if (src === "nar") {
    const last = H.filter(h => h.date !== D.date.replace(/-/g, "")).slice(-1)[0] || null;
    let y = "";
    if (last) {
      const yr = [];
      for (const [mm, lb] of [["1", "単勝 標準"], ["2", "単勝 拡大まで"], ["3", "単勝 広めまで"]]) {
        const e_ = mm !== "1" && last.ext && last.ext[mm] ? last.ext[mm] : { spent: last.spent, ret: last.ret };
        yr.push({ l: lb, spent: e_.spent, ret: e_.ret });
      }
      for (const [k, l] of [["tria", "3連単 大穴"], ["tri", "3連単 中穴"], ["trio", "3連複"], ["myomi", "妙味ワイド"]])
        if (last[k] && last[k].n) yr.push({ l, hit: `${last[k].hit}/${last[k].n}`, spent: last[k].spent, ret: last[k].ret, text: "買いなし" });
      y = `<div class="sech"><span class="eb">${esc(last.date_ja)} のまとめ（地方）</span><span class="dim">確定</span></div>${yr.map(resRow).join("")}`;
    }
    html = `<section class="sec">${y}<div class="note"${y ? ' style="border-top:1px solid var(--line)"' : ""}>地方の結果は、レース確定の数分〜10分後に「速報」で入り、翌朝（8:30ごろ）の確定データで付け直します。</div></section>` + html;
  }
  // 通算
  const tot = [], hs = h => (h.ext && h.ext["4"] && h.ext["4"].spent) ? h.ext["4"] : { spent: h.spent, ret: h.ret };   // 標準（合格＋馬主）。古い日は合格モデルだけ
  if (H.length) { const S = H.reduce((a, h) => ({ spent: a.spent + hs(h).spent, ret: a.ret + hs(h).ret }), { spent: 0, ret: 0 }); if (S.spent) tot.push({ l: "単勝（標準）", spent: S.spent, ret: S.ret }); }
  for (const [mm, lb] of [["2", "単勝（拡大まで）"], ["3", "単勝（広めまで）"]]) {
    const HE = H.filter(h => h.ext && h.ext[mm] && h.ext[mm].spent);
    if (HE.length) tot.push({ l: lb, spent: sum(HE, h => h.ext[mm].spent), ret: sum(HE, h => h.ext[mm].ret) });
  }
  for (const [k, l] of [["tria", "3連単 大穴・地方"], ["exo", "参考の組合せ"], ["tri", src === "nar" ? "3連単 中穴・地方" : "3連単"], ["trio", src === "nar" ? "3連複・地方" : "3連複"], ["myomi", "妙味ワイド"]]) {
    const Z = H.filter(h => h[k] && h[k].n); if (Z.length) tot.push({ l, hit: `${sum(Z, h => h[k].hit)}/${sum(Z, h => h[k].n)}`, spent: sum(Z, h => h[k].spent), ret: sum(Z, h => h[k].ret), text: "買いなし" });
  }
  const HX = H.filter(h => h.axis && h.axis[mode] && h.axis[mode].spent); if (HX.length) tot.push({ l: "3連単（1着固定）", spent: sum(HX, h => h.axis[mode].spent), ret: sum(HX, h => h.axis[mode].ret) });
  const HW = H.filter(h => h.w5 && h.w5.spent); if (HW.length) tot.push({ l: "WIN5", hit: `${HW.filter(h => h.w5.hit).length}/${HW.length}回`, spent: sum(HW, h => h.w5.spent), ret: sum(HW, h => h.w5.ret) });
  if (tot.length) html += `<section class="sec"><div class="sech"><span class="eb">これまでの通算</span><span class="dim">${H.length}日</span></div>${tot.map(resRow).join("")}</section>`;
  // 細かい表と凡例
  html += `<section class="sec"><details class="info" data-k="byrace" style="border-top:0"><summary>レースごとの結果</summary><div class="sb">
    <table><tr><th>レース</th><th>1着</th><th>単勝</th></tr>${done.map(r =>
      `<tr><td>${esc(r.venue)}${r.R}R</td><td>${r.result.first.join("・")}</td><td>${buysOf(r).length ? `${buysOf(r).map(b => b.no).join("・")} → ${retOf(r) ? `<b class="upc">${yen(retOf(r))}</b>` : "0円"}` : "—"}</td></tr>`).join("")}</table></div></details>
    ${H.length ? `<details class="info" data-k="byday"><summary>日ごとの単勝（合格版）</summary><div class="sb"><table><tr><th>日付</th><th>買い</th><th>的中</th><th>回収率</th></tr>${[...H].reverse().map(h => `<tr><td>${esc(h.date_ja)}</td><td>${h.bets}</td><td>${h.hits}</td><td>${pctS(h.ret, h.spent)}</td></tr>`).join("")}</table></div></details>` : ""}
    <details class="info" data-k="legend"><summary>凡例（それぞれの買い方の説明）</summary><dl class="leg">
    <dt>モデルの実績</dt><dd>過去＝バックテストの年ごとの平均（${src === "nar" ? "地方 2020〜26年" : "中央 2018〜26年"}）。本番＝実際に予想を出し始めてからの記録（各100円の想定、お金は賭けていない）。</dd>
    <dt>単勝</dt><dd>勝率×オッズ×変化率＝期待値が基準以上の馬。各100円。標準＝合格モデル＋馬主モデル。拡大・広めは試験中。</dd>
    <dt>妙味ワイド（地方・試験中）</dt><dd>軸＝1〜3番人気で勝率が世間の1.2倍以上。穴＝5番人気以下・10倍以上で1.3倍以上。消し＝1〜3番人気で0.85倍未満。過去 1日4.6R、的中約4割、回収107〜114%。</dd>
    <dt>3連単 1着固定（試験中）</dt><dd>単勝の馬を1着固定、2・3着は期待値1.2以上を5点まで。過去139〜149%、的中は約70点に1回。</dd>
    <dt>3連単・中央（試験中）</dt><dd>地方と同じ作り（中央の3着内モデルで2・3着を直す）。選ぶのは推定オッズ、本物のオッズは表示用。過去 1日16〜19R、的中4〜7%、回収 89〜121%（年でばらつき大、地方より弱い）。</dd>
    <dt>3連単 中穴・地方（試験中）</dt><dd>1着は勝率、2・3着は3着内モデルの「滑り込む力」で直した並び確率×推定オッズ。見立て0.5%以上・推定500倍以下を期待値順に10点まで。期待値0.75以上100円・0.8以上200円・0.85以上300円。過去 1日19R、的中約9%、回収121〜122%。</dd>
    <dt>3連単 大穴・地方（試験中）</dt><dd>1着を単勝の穴モデルの馬（10〜100倍・期待値1.2以上）に固定し、2・3着は滑り込み補正の並び確率×推定オッズで期待値0.8以上を10点まで、各100円。過去 1日6〜7R、的中1〜2%、配当の中央値 約2.5万円、回収 140〜175%（2022年は109%）。数回の大当たりで決まる宝くじ型。</dd>
    <dt>3連複・地方（試験中）</dt><dd>3連単と同じ並び確率を6通り足したもの×推定オッズ。見立て1%以上・推定200倍以下を期待値順に10点まで、金額の濃淡は3連単と同じ。過去 1日16〜17R、平均2点、的中約22%、回収114〜121%。</dd>
    <dt>金額の3本線</dt><dd>買い目の右の3本線は金額の濃淡（1本＝100円、2本＝200円、3本＝300円）。</dd>
    <dt>展開</dt><dd>前に行きそうな馬・後ろから行く馬と、ハイペース／スロー、内が有利／外が有利になったときに3着以内の確率が上がる馬・下がる人気馬。</dd>
    <dt>WIN5（試験中）</dt><dd>勝率と世間の票の偏りから、配当の割に起きやすい組。過去256回で約140%。</dd>
    <dt>速報と確定</dt><dd>地方はレースが確定すると数分〜10分ほどで「速報」の印つきで答え合わせを出し、翌朝の確定データで付け直す（速報と確定は過去の照合で全件一致）。</dd>
    <dt>数字</dt><dd>回収率＝払戻÷買った額。地方の結果はレース後に速報、翌朝8:30ごろ確定。</dd>
    <dt>表示</dt><dd>右上の丸いボタンで明るい表示・暗い表示を切り替え（端末ごとに覚える）。上の「更新」の行を押すと、すぐ読み込み直す。</dd></dl></details></section>`;
  return html;
}

// ---------- 描く
const OPEN = new Map();   // 開け閉めの記憶（描き直しても、タブを移っても、そのまま）
let lastHtml = "", lastKey = null;
function dkey(d, pre) {
  if (d.dataset.k) return pre + d.dataset.k;
  const root = d.parentElement.closest("[data-k]"), sm = d.querySelector(":scope > summary");
  return pre + (root ? root.dataset.k : "v") + "|" + (sm ? sm.textContent.replace(/[0-9０-９,.\-→・:：%円（）()\s]+/g, "").slice(0, 24) : "");
}
function fmtLeft(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`; }
let overKey = "";
function tick(fromRender) {
  let over = "";
  document.querySelectorAll("[data-close]").forEach(c => {
    const left = Math.max(0, Math.floor((new Date(c.dataset.close) - now()) / 1000));
    c.textContent = fmtLeft(left); c.classList.toggle("soon", left < 600 && left >= 120); c.classList.toggle("now", left < 120);
    if (c.id === "cd") { const p = $("#prog"); if (p) p.style.width = Math.max(0, Math.min(100, (1 - left / 1800) * 100)) + "%"; }
    if (!left) over += c.dataset.close;
  });
  // 発走時刻を過ぎたら、1秒後に一度だけ描き直して次のレースへ（同じ時刻では二度やらない）
  if (over && over !== overKey && !fromRender && D && !D.now_override) { overKey = over; setTimeout(render, 1050); }
}
function dock() {   // 「次のレース」以外のタブでも、次の発走までの残り時間を上に出す
  const el = $("#dock"), up = D ? upcoming() : [];
  if (!up.length || tab === "next") { el.hidden = true; return; }
  const r = up[0], k = D.date + r.id + r.post;
  if (el.dataset.k !== k) { el.dataset.k = k; el.innerHTML = `<span class="eb">次</span><b>${esc(r.venue)} ${r.R}R</b><span class="dt">発走 ${r.post}</span><span class="n dc" data-close="${t(r.post).toISOString()}"></span>`; }
  el.hidden = false;
}
function render() {
  if (!D) return;
  mode = "3";   // 広めまで全部表示（札で区別）
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const view = $("#view"), key = src + "/" + tab + "/", nx = upcoming()[0];
  D.__nx = nx ? nx.id : null;
  const html = perfStrip() + (tab === "next" ? viewNext() : tab === "today" ? viewToday() : viewResult());
  dock();
  if (html === lastHtml && key === lastKey) { tick(true); return; }
  if (lastKey) view.querySelectorAll("details").forEach(d => OPEN.set(dkey(d, lastKey), d.open));
  const y = window.scrollY, same = key === lastKey, pf = $("#perf"), px = pf ? pf.scrollLeft : 0;
  view.classList.toggle("enter", !same); view.classList.add("still");
  view.innerHTML = html; lastHtml = html; lastKey = key;
  view.querySelectorAll("details").forEach(d => { const k = dkey(d, key); if (OPEN.has(k)) d.open = OPEN.get(k); });
  if (same) { window.scrollTo(0, y); if ($("#perf")) $("#perf").scrollLeft = px; }
  requestAnimationFrame(() => requestAnimationFrame(() => view.classList.remove("still")));
  tick(true);
}

async function load() {
  const dot = document.querySelector("#meta .live"); if (dot) dot.classList.add("spin");
  try {
    const q = "?t=" + Date.now();
    const DEMO = new URLSearchParams(location.search).has("demo");   // ?demo=1 のときは過去の再現（data/demo_*.json）を表示
    const pre = (DEMO ? "demo_" : "") + (src === "nar" ? "nar_" : "");
    D = await (await fetch(`data/${pre}today.json` + q, { cache: "no-store" })).json();
    try { H = await (await fetch(`data/${pre}history.json` + q, { cache: "no-store" })).json(); } catch { H = []; }
    document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.src === src));
    const age = (Date.now() - new Date(D.generated.replace(" ", "T") + ":00+09:00")) / 60000;   // 予想係は動いている間10分おきに更新する
    const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    const stale = D.date === today && age > 20 && (new Date().getUTCHours() + 9) % 24 < (src === "nar" ? 22 : 18);
    $("#meta").innerHTML = `<i class="live${stale ? " stale" : ""}"></i>${stale ? `<b>${Math.round(age)}分間更新なし</b> ・ ` : ""}${esc(D.date_ja)} ・ 更新 ${D.generated.slice(11, 16)} ・ 判定 ${esc(lbl())}`;
    const s = $("#sample"); s.hidden = !D.sample; s.textContent = D.sample || "";
    render();
  } catch (e) {
    $("#meta").innerHTML = `<i class="live stale"></i>${src === "nar" ? "地方のデータはまだありません" : "データを読み込めませんでした（電波を確認）"}`;
    document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.src === src));
    if (src === "nar" || !D) { D = null; lastHtml = ""; lastKey = null; $("#dock").hidden = true; $("#sample").hidden = true;
      $("#view").innerHTML = `<section class="sec"><div class="msg" style="border-top:0;color:var(--ink3)">${src === "nar" ? "地方の今日のデータがまだ届いていません。" : "データを読み込めませんでした。電波のよい所で、上の行を押して読み込み直してください。"}</div></section>`; }
  }
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (src === b.dataset.src) return; src = b.dataset.src; LS.set("src", src); venue = null; $("#dock").dataset.k = ""; load(); });
function goTab(v) { tab = v; LS.set("tab", tab); render(); window.scrollTo(0, 0);
  const nr = tab === "today" && document.getElementById("nextrow"); if (nr) nr.scrollIntoView({ block: "center" }); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => goTab(b.dataset.tab));
$("#dock").onclick = () => goTab("next");
$("#meta").onclick = () => load();
$("#view").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (b) { venue = b.dataset.v; render(); } });
setInterval(() => tick(), 1000);
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
// 上の帯の高さ（会場の切り替えを、その下に貼りつけるため）
if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px")).observe(document.querySelector("header"));
// 明るい表示・暗い表示（何も選ばなければ端末の設定に合わせる）
const DARK = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : { matches: false };
function isDark() { const th = document.documentElement.dataset.theme; return th ? th === "dark" : DARK.matches; }
function paintTheme() { document.querySelector('meta[name="theme-color"]').content = isDark() ? "#141618" : "#ffffff"; }
$("#themeb").onclick = () => { const v = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = v; LS.set("theme", v); paintTheme(); };
if (DARK.addEventListener) DARK.addEventListener("change", paintTheme);
paintTheme();
document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
load();
// 緊急チェック: 中継サービス ntfy.sh の合言葉チャンネルに合図 → PC の緊急チェック係（code\musu_sos.py）が点検・修正し data/sos.json に結果を出す
const SOS_TOPIC = "musu-sos-6f1873a77b020c2b";
function sosShow(h) { const b = $("#sos"); b.hidden = false; b.innerHTML = `<button class="xb" aria-label="閉じる" onclick="$('#sos').hidden=true">×</button>` + h; }
function sosRes(j) {
  const head = j.phase === "fixing" ? "直しています…" : j.ok ? `<span class="ok">○</span> 正常に動いています` : "直りきっていません";
  return `<b>${head}</b>${j.note ? `<div>${j.note}</div>` : ""}<div class="mu">点検 ${j.checked.slice(11, 16)}</div>` +
    j.items.map(x => `<div class="it"><span class="${x.ok ? "ok" : "ng"}">${x.ok ? "○" : "×"} ${x.name}</span>：${x.msg}${x.fix ? `<br>→ ${x.fix}` : ""}</div>`).join("");
}
$("#sosb").onclick = async () => {
  if (!confirm("PC に緊急チェックを頼みますか？（点検して、直るところまで直します）")) return;
  const t0 = Date.now();
  try { await fetch(`https://ntfy.sh/${SOS_TOPIC}`, { method: "POST", body: "check" }); }
  catch { sosShow("合図を送れませんでした（電波を確認）"); return; }
  sosShow("PC に合図を送りました。点検中です（1〜3分）…");
  for (let i = 0; i < 60; i++) {   // 直して確かめるのを最大3回くり返すので、最長15分ほど待つ
    await new Promise(r => setTimeout(r, 15000));
    try {
      const j = await (await fetch("data/sos.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (new Date(j.asked + "+09:00") >= t0 - 60000) { sosShow(sosRes(j)); if (j.phase !== "fixing") { load(); return; } continue; }
    } catch {}
    sosShow(`PC に合図を送りました。点検中です…（${Math.round((Date.now() - t0) / 60000)}分経過）`);
  }
  sosShow("PC から返事がありません。PC の電源・ネット接続か、緊急チェック係（タスク musu_sos）が動いていない可能性があります。");
};
