<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#105e3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="musu競馬">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>musu 競馬予想</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#16201b;--sub:#5d6b64;--line:#e2e8e5;--accent:#105e3e;--accent2:#e6f2ec;--buy:#c2410c;--buybg:#fff1e8;--hit:#15803d;--miss:#9aa5a0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1412;--card:#18201c;--text:#e8efeb;--sub:#97a69e;--line:#26302b;--accent:#3fbf86;--accent2:#1b2c24;--buy:#fb923c;--buybg:#2a1d14;--hit:#4ade80;--miss:#6b7770}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:17px;font-weight:700}
header .meta{font-size:12px;opacity:.85;margin-top:2px}
.sosb{margin-left:auto;border:1px solid #fff !important;background:#b91c1c !important;color:#fff !important;font-weight:700}
#sos{margin:10px 16px 0;padding:12px;border-radius:12px;background:var(--card);border:2px solid #b91c1c;font-size:14px;line-height:1.5}
#sos .it{padding:6px 0;border-top:1px solid var(--line)}#sos .ng{color:#b91c1c;font-weight:700}#sos .ok{color:var(--hit)}#sos .x{float:right;border:0;background:none;color:var(--sub);font-size:18px}
.src{display:flex;gap:6px;margin-top:6px}.src button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px}.src button.on{background:#fff;color:var(--accent);font-weight:700}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.race-title{font-size:20px;font-weight:800;margin:0}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.count{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);white-space:nowrap}
.badge.buy{background:var(--buybg);color:var(--buy)}
.badge.hit{background:var(--hit);color:#fff}
.badge.miss{background:transparent;color:var(--miss);border:1px solid var(--line)}
.buy-box{background:var(--buybg);border-radius:12px;padding:12px;margin-top:12px}
.buy-box h3{margin:0 0 8px;font-size:14px;color:var(--buy)}
.horse{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.horse:first-of-type{border-top:0}
.num{flex:0 0 40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}
.buy-box .num{background:var(--buy)}
.hname{font-size:17px;font-weight:700}
.right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:800}
.none{padding:14px;text-align:center;color:var(--sub);background:var(--accent2);border-radius:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
th{color:var(--sub);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font-size:15px;white-space:nowrap}
.modebar{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.modebar button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12px}
.modebar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.line{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--accent2);font-size:14px;line-height:1.5}
.line.mute{background:transparent;border:1px solid var(--line);color:var(--sub)}
.sec{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:0 11px}
.sec>summary{padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.sec>summary b{font-weight:700}
.sec[open]>summary{border-bottom:1px solid var(--line)}
.info>summary{color:var(--sub);font-size:12px;padding:6px 0}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.rrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rno{flex:0 0 44px;font-size:18px;font-weight:800}
.rmid{flex:1;min-width:0}
.rmid .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:var(--accent2);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
table.sim{width:100%;border-collapse:collapse;font-size:11px;letter-spacing:-0.2px;font-variant-numeric:tabular-nums}
table.sim th,table.sim td{padding:3px 2px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sim th{color:var(--sub);font-weight:600}
.sample{background:#fde68a;color:#713f12;font-size:12px;font-weight:700;padding:6px 16px}
</style>
</head>
<body>
<header><h1>musu 競馬予想</h1><div class="meta" id="meta">読み込み中…</div><div class="src"><button data-src="jra">中央</button><button data-src="nar">地方（検証中）</button><button class="sosb" id="sosb">🆘 緊急チェック</button></div></header>
<div id="sos" hidden></div>
<div class="sample" id="sample" hidden></div>
<main id="view"></main>
<nav>
  <button data-tab="next" class="on"><span class="ic">⏱</span>次のレース</button>
  <button data-tab="today"><span class="ic">📋</span>今日のレース</button>
  <button data-tab="result"><span class="ic">📊</span>結果</button>
</nav>
<script>
let D = null, H = [], tab = localStorage.getItem("tab") || "next", venue = null, src = localStorage.getItem("src") || "jra";
const lbl = () => D.decision_label || `締切${D.decision_min}分前`;
const $ = s => document.querySelector(s);
const yen = v => (v ?? 0).toLocaleString("ja-JP") + "円";
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function now() { return D && D.now_override ? new Date(D.now_override) : new Date(); }
function t(hm) { const [h, m] = hm.split(":").map(Number); const d = new Date(D.date + "T00:00:00+09:00"); d.setHours(h, m, 0, 0); return d; }

// 単勝の型の切り替え（1=合格版、2=拡大版、3=広め。2・3は検証中）。中央のみ
let modeSel = "1", mode = "1";   // modeSel=選んだ型、mode=今の表示に使う型（地方は常に合格版の扱い）
try { modeSel = localStorage.getItem("mode") || "1"; if (!["1", "2", "3"].includes(modeSel)) modeSel = "1"; } catch {}
const MODES = { "1": "標準", "2": "拡大", "3": "広め" };   // 標準＝合格モデル＋馬主モデル（2026-11-08 から）
const TIERTAG = { 2: "拡大", 3: "広め", 4: "馬主モデルのみ" };
// 単勝の買い: 標準＝合格モデルの買い＋馬主モデルだけの買い（tier 4）。拡大・広めはさらに tier 2・3 を足す
function buysOf(r) { const ex = r.buys_ext || []; return r.buys.concat(ex.filter(b => b.tier === 4 || (mode !== "1" && b.tier <= +mode))); }
function retOf(r) { if (!r.result) return 0; const w = new Set(r.result.first); return buysOf(r).filter(b => w.has(b.no)).length * (r.result.tan || 0); }
function modeBar() {
  if (src !== "jra") return "";
  const L = { "1": "標準", "2": "拡大", "3": "広め" };
  return `<div class="modebar">単勝の範囲 ${Object.entries(L).map(([k, v]) => `<button data-mode="${k}" class="${k === mode ? "on" : ""}">${v}</button>`).join("")}<span>${mode === "1" ? "" : "（試験中）"}</span></div>`;
}

function status(r) {
  if (r.state === "out") return ["対象外", "miss"];
  const bs = buysOf(r);
  if (r.result && r.state === "decided") return bs.length ? (retOf(r) > 0 ? ["単勝 的中", "hit"] : ["単勝 外れ", "miss"]) : ["単勝 見送り", "miss"];
  if (r.state === "missed") return ["単勝 判定なし", "miss"];
  if (r.state === "decided") return bs.length ? [`単勝 ${bs.length}頭`, "buy"] : ["単勝 見送り", ""];
  return ["予想前", ""];
}

function axisBox(r) {
  // 単勝の買い馬（選択中の型）を1着に固定した3連単（検証中）
  const am = mode === "4" ? "1" : mode, list = (r.axis || {})[am] || [], res = (r.axis_res || {})[am];
  if (!list.length) return "";
  const hit = new Set(res ? res.hits : []);
  const badge = res ? `<span class="badge ${res.ret ? "hit" : "miss"}">${res.ret ? "的中 " + yen(res.ret) : "外れ"}</span>` : `<span class="sub">${list.length}点・${yen(100 * list.length)}</span>`;
  return `<details class="sec"><summary><span>🧲 <b>単勝の馬を1着にした3連単</b></span>${badge}</summary>
    <table><tr><th>組番</th><th>オッズ</th><th>期待値</th></tr>${list.map(e => `<tr><td>${hit.has(e.type + e.kumi) ? "🎯 " : ""}${esc(e.kumi)}</td><td>${e.odds ? e.odds.toFixed(1) : "—"}</td><td>${e.ev.toFixed(2)}</td></tr>`).join("")}</table>
    <details class="info"><summary>ℹ この買い方について</summary><div class="note">各100円（単勝より少なめの額で）。${mode === "1" ? "合格版" : "拡大版まで"}の馬を1着に固定し、2・3着は勝率と「2・3着の来やすさ」から期待値1.2以上の組を5点まで。過去の試算は 139%／149% だが、約70点に1回しか当たらず、数回の大当たりで稼ぐ形（大当たり3回を除くと約95%）。長い外れが続くのが普通です。（検証中）</div></details></details>`;
}

function horseRows(list, withEv) {
  return list.map(h => `<div class="horse"><div class="num">${h.no}</div>
    <div><div class="hname">${h.both === true ? `<span class="badge hit">★両方</span> ` : h.both === false ? `<span class="badge">合格モデルのみ</span> ` : ""}${h.tier ? `<span class="badge">${TIERTAG[h.tier]}</span> ` : ""}${esc(h.name)}</div><div class="sub">勝率 ${pct(h.p)}${withEv ? ` ・ 期待値 ${h.ev.toFixed(2)}` : ` ・ 必要オッズ ${h.need.toFixed(1)}倍`}</div></div>
    <div class="right"><div class="big">${h.odds.toFixed(1)}<span class="sub">倍</span></div></div></div>`).join("");
}

function oshiBox(r) {
  // 🔮 推し: 4番人気以下で3着以内に来ると読んだ馬（1レース1頭・検証中）
  const o = r.oshi; if (!o) return "";
  const res = r.oshi_res;
  const badge = res ? (res.win ? `<span class="badge hit">1着！</span>` : res.hit ? `<span class="badge hit">的中（3着以内）</span>` : `<span class="badge miss">外れ</span>`) : "";
  return `<div style="margin:8px 0 10px;padding:12px;border-radius:12px;background:var(--accent2)">
    <div class="row between"><b>🔮 推し ${o.strong ? "★★" : "★"}</b>${badge}</div>
    <div style="font-size:18px;font-weight:700;margin:6px 0">${o.no}番 ${esc(o.name)} <span class="sub">${o.ninki}番人気・${o.odds.toFixed(1)}倍</span></div>
    <div><b>3着以内に来る</b>と読みます${o.p >= 0.15 ? "（1着まであるかも）" : ""}</div>
    <div class="sub">3着以内の見立て ${(o.t3 * 100).toFixed(0)}%（世間は ${(o.t3m * 100).toFixed(0)}%）</div>
    ${o.why && o.why.length ? `<div class="note" style="margin-top:6px">理由：${o.why.map(esc).join("／")}</div>` : ""}
  </div>`;
}

function simMore(v, res) {   // 🎬 の中の「▼ 10万回の中身」: 上位10の決着と馬ごとの着順（開いた時だけ）
  if (!v.horses && !v.trio10) return "";
  const k = x => Math.round(x * 100000).toLocaleString();
  const mark = (list, hit) => (list || []).map((x, i) => `<tr${hit && x.kumi === hit ? ' style="background:var(--buybg);font-weight:700"' : ""}><td>${i + 1}</td><td style="text-align:left">${esc(x.kumi)}${hit && x.kumi === hit ? " ✅" : ""}</td><td>${k(x.p)}回</td></tr>`).join("");
  const hs = (v.horses || []).map(h => `<tr><td style="text-align:left"><b>${h.no}</b><div class="sub" style="font-size:10px;max-width:4.2em;overflow:hidden;text-overflow:ellipsis">${esc(h.name || "")}</div></td>
      <td>${k(h.p1)}</td><td>${k(h.p2)}</td><td>${k(h.p3)}</td><td><b>${pct(h.p1)}</b></td><td>${pct(h.p1 + h.p2)}</td><td>${pct(h.p1 + h.p2 + h.p3)}</td></tr>`).join("");
  return `<details class="info" style="margin-top:8px"><summary>▼ 10万回の中身（上位10の決着・馬ごとの着順）</summary>
    ${hs ? `<div class="sub" style="margin:6px 0 2px">馬ごと（10万回のうち何回その着順か）</div>
    <div style="overflow-x:auto"><table class="sim"><tr><th style="text-align:left">馬</th><th>1着</th><th>2着</th><th>3着</th><th>勝率</th><th>連対</th><th>複勝</th></tr>${hs}</table></div>` : ""}
    ${v.trio10 ? `<div class="sub" style="margin:8px 0 2px">3連複 上位10</div><table class="sim"><tr><th>順</th><th style="text-align:left">組</th><th>10万回中</th></tr>${mark(v.trio10, res && res.trio)}</table>` : ""}
    ${v.tri10 ? `<div class="sub" style="margin:8px 0 2px">3連単 上位10</div><table class="sim"><tr><th>順</th><th style="text-align:left">組</th><th>10万回中</th></tr>${mark(v.tri10, res && res.trifecta)}</table>` : ""}
  </details>`;
}

function paceBox(r) {
  // 🎬 展開予想（検証中）
  const v = r.pace; if (!v) return "";
  const res = r.pace_res, lab = { high: "ハイペースなら", slow: "スローなら", inner: "内が伸びる馬場なら", outer: "外が伸びる馬場なら", chaos: "荒れるなら", calm: "堅く決まるなら" };
  const sc = ["high", "slow", "inner", "outer", "chaos"].filter(k => v.scen[k] && v.scen[k].diff > 0.02)
    .map(k => `<li>${lab[k]}：<b>${v.scen[k].no}番 ${esc(v.scen[k].name)}</b>（3着以内 ${pct(v.scen[k].t3)}、+${(v.scen[k].diff * 100).toFixed(0)}pt）</li>`).join("");
  const tri = v.trifecta[0], trio = v.trio[0];
  let today = "";
  if (v.today) {
    const t_ = v.today, words = [];
    if (t_.front === "front") words.push("前に行った馬が残っている");
    if (t_.front === "back") words.push("後ろからの差しが決まっている");
    if (t_.gate === "inner") words.push("内枠が来ている");
    if (t_.gate === "outer") words.push("外枠が来ている");
    const pk = t_.pick && v.scen[t_.pick];
    today = words.length
      ? `<div class="line">🏟 <b>今日の馬場：${words.join("・")}</b>${pk ? `<br>→ この馬場なら <b>${pk.no}番 ${esc(pk.name)}</b>（3着以内 ${pct(pk.t3)}）` : ""}<div class="sub">この場の前の${t_.n}レースから自動で判断（同じ傾向が続くのは6割ほど）</div></div>`
      : `<div class="line mute">🏟 今日の馬場：${t_.n ? "はっきりした偏りはまだ見えない" : "この場の最初のレースなので、まだ分からない"}</div>`;
  }
  const hit = res ? (res.tri_rank ? `<span class="badge hit">3連単 的中！</span>` : res.trio_rank ? `<span class="badge hit">3連複 的中</span>` : `<span class="badge miss">外れ（${esc(res.trio)}${(() => { const i = (v.trio10 || []).findIndex(x => x.kumi === res.trio); return i >= 0 ? `・${i + 1}番目` : ""; })()}）</span>`) : "";
  return `${today}
    <details class="sec"><summary><span>🎬 起きやすい決着 <b>3連複 ${esc(trio.kumi)}</b></span>${hit || '<span class="sub">くわしく ▼</span>'}</summary>
    <div style="padding:6px 0 8px">
      ${v.front && v.front.length ? `<div>前に行きそう：<b>${v.front.map(h => `${h.no}番`).join("・")}</b>　後ろから：${v.back.map(h => `${h.no}番`).join("・")}</div>` : ""}
      <div style="margin-top:4px">10万回走らせると：3連単 <b>${esc(tri.kumi)}</b> が約${Math.round(tri.p * 100000).toLocaleString()}回、3連複 <b>${esc(trio.kumi)}</b> が約${Math.round(trio.p * 100000).toLocaleString()}回（いちばん多い決着）</div>
      ${sc ? `<div class="sub" style="margin-top:6px">もしもの展開</div><ul style="margin:2px 0 0 18px;padding:0">${sc}</ul>` : ""}
      ${simMore(v, res)}
      <details class="info"><summary>ℹ 展開予想について</summary><div class="note">ペース・馬場の内外・荒れ具合で馬が「まとめて動く」ことを入れて全通りを計算（10万回のシミュレーションを無限回まわしたのと同じ）。過去の確認で、今の計算より1〜3着の当たり方がわずかに良い。（検証中）</div></details>
    </div></details>`;
}

function asobiBox(r) {
  // お楽しみ馬券（遊び用・別帳簿）
  const res = r.asobi_res, hit = new Set(res ? res.hits : []);
  if (!r.asobi.length) return "";
  const n3 = r.asobi.filter(e => e.type === "3連複").length, nt = r.asobi.length - n3;
  const badge = res ? `<span class="badge ${res.hits.length ? "hit" : "miss"}">${res.hits.length ? "的中 " + yen(res.ret) : "外れ"}</span>` : `<span class="sub">${[n3 ? `3連複${n3}点` : "", nt ? `3連単${nt}点` : ""].filter(Boolean).join("・")}・${yen(100 * r.asobi.length)}</span>`;
  return `<details class="sec" style="border-style:dashed"><summary><span>🎉 <b>お楽しみ馬券</b></span>${badge}</summary>
    <table><tr><th>券種</th><th>組番</th><th>オッズ</th></tr>${r.asobi.map(e => `<tr><td>${esc(e.type)}</td><td>${hit.has(e.kumi) ? "🎯 " : ""}${esc(e.kumi)}</td><td>${e.odds.toFixed(1)}</td></tr>`).join("")}</table>
    <details class="info"><summary>ℹ お楽しみ馬券について</summary><div class="note">各100円。オッズ30〜100倍（配当3,000〜10,000円）で、勝率モデルから見て期待値の高い組。過去の試算の回収率は3連複で約8割、3連単で約10割。勝てると確認された買い方ではないので、遊ぶ金額を決めて楽しむ用です。</div></details></details>`;
}

function raceDetail(r, opt = {}) {
  const [s, cls] = status(r);
  let html = "";
  if (!opt.noHead) html += `<div class="row between"><div><p class="race-title">${esc(r.venue)} ${r.R}R</p>
    <div class="sub">${[r.name ? esc(r.name) : "", `発走 ${r.post}`, `締切 ${r.close}`].filter(Boolean).join(" ・ ")}</div></div><span class="badge ${cls}">${s}</span></div>`;
  if (r.state === "out" || r.state === "missed") {
    html += `<div class="line mute">${esc(r.note || "予想の対象外")}</div>`;
  } else if (r.state === "decided" || r.result) {
    html += oshiBox(r);
    html += paceBox(r);
    const bs = buysOf(r);
    html += bs.length
      ? `<div class="buy-box"><h3>💴 単勝で買う（各100円${mode === "1" ? "" : "・" + MODES[mode] + "を含む"}）</h3>${horseRows(bs, true)}${bs.some(b => b.both !== undefined || b.tier === 4) ? `<div class="note">★両方＝合格モデルと馬主モデルの両方が「買い」（いちばん信頼できる）。「〜のみ」は片方だけが「買い」。</div>` : ""}</div>`
      : `<div class="line mute">💴 単勝：${r.note ? "予想できませんでした（" + esc(r.note) + "）" : "今回は見送り（条件に合う馬なし）"}</div>`;
    html += axisBox(r);
    if (r.asobi) html += asobiBox(r);
    let more = "";
    if (r.top && r.top.length) more += `<div class="sub" style="margin-top:6px">勝率の高い順</div>${horseRows(r.top, false)}`;
    if (r.exo && r.exo.length) more += `<div class="sub" style="margin-top:8px">参考：組合せ馬券（検証中・記録用）</div>
      <table><tr><th>券種</th><th>組番</th><th>オッズ</th><th>期待値</th></tr>${r.exo.map(e => `<tr><td>${esc(e.type)}</td><td>${esc(e.kumi)}</td><td>${e.odds.toFixed(1)}</td><td>${e.ev.toFixed(2)}</td></tr>`).join("")}</table>`;
    more += `<div class="note">${D.rule_note ? esc(D.rule_note) : `オッズは判定時（締切${D.decision_min}分前）の値。単勝の買う条件: 10〜50倍 かつ 期待値1.15以上。`}</div>`;
    html += `<details class="info" style="margin-top:8px"><summary>▼ くわしい数字（勝率の順・参考の組合せ）</summary>${more}</details>`;
  } else {
    html += `<div class="line mute">予想は ${lbl()}（${r.decide}ごろ）に出ます</div>`;
  }
  if (r.result) {
    html += `<div class="note" style="margin-top:8px">🏁 結果：1着 <b>${r.result.first.join("・")}番</b> ${esc(r.result.first_name || "")}　単勝 ${yen(r.result.tan)}${buysOf(r).length ? `　／　単勝の収支 ${yen(retOf(r) - 100 * buysOf(r).length)}` : ""}</div>`;
  }
  return html;
}

function viewNext() {
  const n = now();
  const up = D.races.filter(r => r.state !== "out" && t(r.post) > n).sort((a, b) => t(a.post) - t(b.post));
  if (!up.length) return `<div class="card"><p class="race-title">本日のレースは終了しました</p><div class="sub">結果は「結果」タブで見られます。</div></div>`;
  const r = up[0], cl = t(r.post)
  const sb = scoreBar(), left = Math.max(0, Math.floor((cl - n) / 1000));
  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  const [s, cls] = status(r);
  let html = sb + `<div class="card" data-k="n${r.id}"><div class="row between"><div><p class="race-title">${esc(r.venue)} ${r.R}R</p>
      <div class="sub">${[r.name && r.name !== r.venue ? esc(r.name) : "", `発走 ${r.post}`].filter(Boolean).join(" ・ ")}</div></div>
      <div style="text-align:right"><div class="sub">発走まで</div><div class="count" id="cd" data-close="${cl.toISOString()}">${mm}:${ss}</div></div></div>
    ${raceDetail(r, { noHead: true })}</div>`;
  const after = up.slice(1, 4);
  if (after.length) html += `<div class="card"><div class="sub" style="margin-bottom:4px">このあとのレース</div>${after.map(x => rowHtml(x, true)).join("")}</div>`;
  return html;
}

function scoreBar() {   // 次のレースの上: 今日ここまでの当たり（結果が1つも無ければ出さない）
  const od = D.races.filter(r => r.oshi_res), pr = D.races.filter(r => r.pace_res);
  const bets = D.races.filter(r => r.result && r.state === "decided" && buysOf(r).length);
  const parts = [];
  if (od.length) parts.push(`🔮 推し <b>${od.filter(r => r.oshi_res.hit).length}/${od.length}</b> 3着内`);
  if (bets.length) { const sp = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), rt = bets.reduce((a, r) => a + retOf(r), 0);
    parts.push(`💴 単勝 <b>${bets.filter(r => retOf(r) > 0).length}/${bets.length}</b>（<b style="color:${rt - sp >= 0 ? "var(--hit)" : "var(--buy)"}">${rt - sp >= 0 ? "+" : ""}${yen(rt - sp)}</b>）`); }
  if (pr.length) parts.push(`🎬 決着 <b>${pr.filter(r => r.pace_res.trio_rank).length}/${pr.length}</b>`);
  if (!parts.length) return "";
  return `<div class="sub" style="margin:0 2px 8px;line-height:1.8">今日ここまで　${parts.map(x => `<span style="white-space:nowrap">${x}</span>`).join("　")}</div>`;
}

function opt_id(r) {   // 今日のレースで、次に締切が来るレースの行に印（開いた時にそこまで動かす）
  const nx = D.races.filter(x => x.state !== "out" && t(x.post) > now()).sort((a, b) => t(a.post) - t(b.post))[0];
  return nx && nx.id === r.id ? ' id="nextrow"' : "";
}

function rowHtml(r, showVenue) {
  const [s, cls] = status(r);
  const bs = (r.state === "decided") ? buysOf(r) : [];
  const tags = [];
  if (r.oshi) tags.push(`🔮${r.oshi.no}番${r.oshi_res ? (r.oshi_res.hit ? "✅" : "") : ""}`);
  if (bs.length) tags.push(`💴${bs.map(b => b.no).join("・")}${r.result && retOf(r) > 0 ? "✅" : ""}`);
  if (r.result) tags.push(`<span style="color:var(--sub)">1着${r.result.first.join("・")}番</span>`);
  return `<details class="rrow-wrap" data-k="r${r.id}"${opt_id(r)}><summary class="rrow"><div class="rno">${r.R}R</div>
    <div class="rmid"><div class="n">${showVenue ? esc(r.venue) + " " : ""}${esc(r.name && r.name !== r.venue ? r.name : "")}</div><div class="sub">発走 ${r.post}${tags.map(x => `　<span style="white-space:nowrap">${x}</span>`).join("")}</div></div>
    <span class="badge ${cls}">${s}</span></summary><div style="padding:4px 0 12px">${raceDetail(r, { noHead: true })}</div></details>`;
}

function viewToday() {
  const venues = [...new Set(D.races.map(r => r.venue))];
  if (!venue || !venues.includes(venue)) {
    const nx = D.races.filter(r => r.state !== "out" && t(r.post) > now()).sort((a, b) => t(a.post) - t(b.post))[0];
    venue = nx ? nx.venue : venues[0];
  }
  const chips = `<div class="chips">${venues.map(v => `<button data-v="${esc(v)}" class="${v === venue ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
  const list = D.races.filter(r => r.venue === venue).sort((a, b) => a.R - b.R);
  return chips + `<div class="card">${list.map(r => rowHtml(r, false)).join("")}</div>`;
}

function viewResult() {
  // 結果タブ: いちばん上に「今日のまとめ」（種類ごとに1行）、その下に通算、細かい表は押すと開く
  const done = D.races.filter(r => r.result && r.state === "decided");
  const pctS = (r_, s_) => s_ ? ((r_ / s_) * 100).toFixed(0) + "%" : "—";
  const pm = v => `<b style="color:${v > 0 ? "var(--hit)" : v < 0 ? "var(--buy)" : "inherit"}">${v > 0 ? "+" : ""}${yen(v)}</b>`;
  const rows = [];
  // 単勝
  const bets = done.filter(r => buysOf(r).length);
  const spent = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), ret = bets.reduce((a, r) => a + retOf(r), 0);
  const money = (r_, s_) => `${pm(r_ - s_)}<div class="sub">回収率 ${pctS(r_, s_)}</div>`;
  rows.push([`💴 単勝${src === "jra" && mode !== "1" ? `（${MODES[mode]}）` : ""}`, bets.length ? `${bets.filter(r => retOf(r) > 0).length}/${bets.length}` : "—", spent ? money(ret, spent) : `<span class="sub">買いなし</span>`]);
  // 推し
  const od = D.races.filter(r => r.oshi_res);
  if (D.races.some(r => r.oshi)) rows.push(["🔮 推し", `${od.filter(r => r.oshi_res.hit).length}/${od.length}`, `<span class="sub">3着以内に来た数${od.filter(r => r.oshi_res.win).length ? `（1着 ${od.filter(r => r.oshi_res.win).length}）` : ""}</span>`]);
  // 展開予想
  const pr = D.races.filter(r => r.pace_res);
  if (pr.length) rows.push(["🎬 決着予想", `${pr.filter(r => r.pace_res.trio_rank).length}/${pr.length}`, `<span class="sub">3連複が上位3つに入った数</span>`]);
  // 🧲
  const xd = D.races.filter(r => r.axis_res && r.axis_res[mode] && r.axis_res[mode].bet);
  if (xd.length) { const xs = xd.reduce((a, r) => a + r.axis_res[mode].bet, 0), xr = xd.reduce((a, r) => a + r.axis_res[mode].ret, 0);
    rows.push(["🧲 3連単", `${xd.filter(r => r.axis_res[mode].ret).length}/${xd.length}`, money(xr, xs)]); }
  // 🎉
  const ad = D.races.filter(r => r.asobi_res);
  if (ad.length) { const as = ad.reduce((a, r) => a + r.asobi_res.bet, 0), ar = ad.reduce((a, r) => a + r.asobi_res.ret, 0);
    rows.push(["🎉 お楽しみ", `${ad.filter(r => r.asobi_res.hits.length).length}/${ad.length}`, money(ar, as)]); }
  let html = `<div class="card"><div class="sub" style="margin-bottom:6px">今日 ${D.date_ja} のまとめ（結果が出た ${done.length}/${D.races.filter(r => r.state !== "out").length}レース）</div>
    <table><tr><th style="text-align:left">種類</th><th>的中</th><th>収支</th></tr>${rows.map(r => `<tr><td style="text-align:left;white-space:nowrap">${r[0]}</td><td style="white-space:nowrap">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <div class="note">各100円で買った場合。🧲・🎉・拡大・広めは試験中の買い方です。</div></div>`;
  // 通算
  const tot = [];
  const hs = h => (h.ext && h.ext["4"] && h.ext["4"].spent) ? h.ext["4"] : { spent: h.spent, ret: h.ret };   // 標準（合格＋馬主）。古い日は合格モデルだけ
  if (H.length) { const S = H.reduce((a, h) => ({ spent: a.spent + hs(h).spent, ret: a.ret + hs(h).ret }), { spent: 0, ret: 0 }); if (S.spent) tot.push(["💴 単勝（標準）", `${pctS(S.ret, S.spent)}　${pm(S.ret - S.spent)}`]); }
  const HE = H.filter(h => h.ext && h.ext[mode] && h.ext[mode].spent);
  if (mode !== "1" && HE.length) { const s_ = HE.reduce((a, h) => a + h.ext[mode].spent, 0), r_ = HE.reduce((a, h) => a + h.ext[mode].ret, 0); tot.push([`💴 単勝（${MODES[mode]}）`, `${pctS(r_, s_)}　${pm(r_ - s_)}`]); }
  const HO = H.filter(h => h.oshi && h.oshi.n); if (HO.length) { const n_ = HO.reduce((a, h) => a + h.oshi.n, 0), h_ = HO.reduce((a, h) => a + h.oshi.hit, 0); tot.push(["🔮 推し", `${h_}/${n_}頭（${pctS(h_, n_)}）が3着以内`]); }
  const HX = H.filter(h => h.axis && h.axis[mode] && h.axis[mode].spent); if (HX.length) { const s_ = HX.reduce((a, h) => a + h.axis[mode].spent, 0), r_ = HX.reduce((a, h) => a + h.axis[mode].ret, 0); tot.push(["🧲 3連単（1着固定）", `${pctS(r_, s_)}　${pm(r_ - s_)}`]); }
  const HA = H.filter(h => h.a_spent); if (HA.length) { const s_ = HA.reduce((a, h) => a + h.a_spent, 0), r_ = HA.reduce((a, h) => a + h.a_ret, 0); tot.push(["🎉 お楽しみ", `${pctS(r_, s_)}　${pm(r_ - s_)}`]); }
  if (tot.length) html += `<div class="card"><div class="sub" style="margin-bottom:6px">これまでの通算（${H.length}日）</div><table>${tot.map(r => `<tr><td style="text-align:left">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>`;
  // 細かい表
  html += `<div class="card"><details class="info"><summary>▼ レースごとの結果</summary>
    <table><tr><th>レース</th><th>1着</th><th>単勝</th><th>推し</th></tr>${done.map(r =>
      `<tr><td style="text-align:left">${esc(r.venue)}${r.R}R</td><td>${r.result.first.join("・")}</td><td>${buysOf(r).length ? `${buysOf(r).map(b => b.no).join("・")}→${retOf(r) ? `<b style="color:var(--hit)">${yen(retOf(r))}</b>` : "0円"}` : "—"}</td><td>${r.oshi ? `${r.oshi.no}${r.oshi_res ? (r.oshi_res.hit ? "✅" : "×") : ""}` : "—"}</td></tr>`).join("")}</table></details>
    ${H.length ? `<details class="info"><summary>▼ 日ごとの単勝（合格版）</summary><table><tr><th>日付</th><th>買い</th><th>的中</th><th>回収率</th></tr>${[...H].reverse().map(h => `<tr><td style="text-align:left">${esc(h.date_ja)}</td><td>${h.bets}</td><td>${h.hits}</td><td>${pctS(h.ret, h.spent)}</td></tr>`).join("")}</table></details>` : ""}</div>`;
  return html;
}

function render() {
  if (!D) return;
  mode = src === "jra" ? modeSel : "1";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  // 描き直しても、開いていた所（レース・🎬・10万回の中身など）と画面の位置はそのまま
  const open = new Set([...document.querySelectorAll("#view details[open]")].map(dkey)), y = window.scrollY, same = lastTab === tab;
  $("#view").innerHTML = modeBar() + (tab === "next" ? viewNext() : tab === "today" ? viewToday() : viewResult());
  document.querySelectorAll(".chips button[data-v]").forEach(b => b.onclick = () => { venue = b.dataset.v; render(); });
  document.querySelectorAll("button[data-mode]").forEach(b => b.onclick = () => { modeSel = b.dataset.mode; try { localStorage.setItem("mode", modeSel); } catch {} render(); });
  document.querySelectorAll("#view details").forEach(d => { if (open.has(dkey(d))) d.open = true; });
  if (same) window.scrollTo(0, y);
  lastTab = tab;
}

let lastTab = null;
function dkey(d) {   // 開閉を覚えるための名前: レース（data-k）＋見出しの文字（数字や結果で変わる部分は除く）
  if (d.dataset.k) return tab + d.dataset.k;
  const root = d.parentElement.closest("[data-k]");
  const sm = d.querySelector(":scope > summary"), sp = sm && (sm.querySelector(":scope > span") || sm);
  return tab + (root ? root.dataset.k : "v") + "|" + (sp ? sp.textContent.replace(/[0-9０-９,.\-→・:：%円（）()]+/g, "").trim().slice(0, 24) : "");
}

async function load() {
  try {
    const q = "?t=" + Date.now();
    const DEMO = new URLSearchParams(location.search).has("demo");   // ?demo=1 のときは過去の再現（data/demo_*.json）を表示
    const pre = (DEMO ? "demo_" : "") + (src === "nar" ? "nar_" : "");
    D = await (await fetch(`data/${pre}today.json` + q, { cache: "no-store" })).json();
    try { H = await (await fetch(`data/${pre}history.json` + q, { cache: "no-store" })).json(); } catch { H = []; }
    document.querySelectorAll(".src button").forEach(b => b.classList.toggle("on", b.dataset.src === src));
    const age = (Date.now() - new Date(D.generated.replace(" ", "T") + ":00+09:00")) / 60000;   // 予想係は動いている間10分おきに更新する
    const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    const stale = D.date === today && age > 20 && (new Date().getUTCHours() + 9) % 24 < (src === "nar" ? 22 : 18);
    $("#meta").textContent = `${D.date_ja} ・ 更新 ${D.generated.slice(11, 16)} ・ 判定 ${lbl()}` + (stale ? ` ・ ⚠ ${Math.round(age)}分間更新なし` : "");
    $("#meta").style.color = stale ? "#d33" : "";
    const s = $("#sample"); s.hidden = !D.sample; s.textContent = D.sample || "";
    render();
  } catch (e) { $("#meta").textContent = src === "nar" ? "地方のデータはまだありません" : "データを読み込めませんでした（電波を確認）"; document.querySelectorAll(".src button").forEach(b => b.classList.toggle("on", b.dataset.src === src)); if (src === "nar") { D = null; $("#view").innerHTML = ""; } }
}
document.querySelectorAll(".src button").forEach(b => b.onclick = () => { src = b.dataset.src; localStorage.setItem("src", src); venue = null; load(); });
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch {} render(); window.scrollTo(0, 0);
  const nr = tab === "today" && document.getElementById("nextrow"); if (nr) nr.scrollIntoView({ block: "center" }); });
setInterval(() => { const c = $("#cd"); if (c) { const left = Math.max(0, Math.floor((new Date(c.dataset.close) - now()) / 1000)); c.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); } }, 1000);
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
// 緊急チェック: 中継サービス ntfy.sh の合言葉チャンネルに合図 → PC の緊急チェック係（code\musu_sos.py）が点検・修正し data/sos.json に結果を出す
const SOS_TOPIC = "musu-sos-6f1873a77b020c2b";
function sosShow(h) { const b = $("#sos"); b.hidden = false; b.innerHTML = `<button class="x" onclick="$('#sos').hidden=true">×</button>` + h; }
function sosRes(j) {
  const head = j.phase === "fixing" ? "🔧 直しています…" : j.ok ? "✅ 正常に動いています" : "⚠ 直りきっていません";
  return `<b>${head}</b>${j.note ? `<div>${j.note}</div>` : ""}<div class="sub">点検 ${j.checked.slice(11, 16)}</div>` +
    j.items.map(x => `<div class="it"><span class="${x.ok ? "ok" : "ng"}">${x.ok ? "○" : "×"} ${x.name}</span>：${x.msg}${x.fix ? `<br>→ ${x.fix}` : ""}</div>`).join("");
}
$("#sosb").onclick = async () => {
  if (!confirm("PC に緊急チェックを頼みますか？（点検して、直るところまで直します）")) return;
  const t0 = Date.now();
  try { await fetch(`https://ntfy.sh/${SOS_TOPIC}`, { method: "POST", body: "check" }); }
  catch { sosShow("合図を送れませんでした（電波を確認）"); return; }
  sosShow("PC に合図を送りました。点検中です（1〜3分）…");
  for (let i = 0; i < 60; i++) {   // 直して確かめるのを最大3回くり返すので、最長15分ほど待つ
    await new Promise(r => setTimeout(r, 15000));
    try {
      const j = await (await fetch("data/sos.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (new Date(j.asked + "+09:00") >= t0 - 60000) { sosShow(sosRes(j)); if (j.phase !== "fixing") { load(); return; } continue; }
    } catch {}
    sosShow(`PC に合図を送りました。点検中です…（${Math.round((Date.now() - t0) / 60000)}分経過）`);
  }
  sosShow("PC から返事がありません。PC の電源・ネット接続か、緊急チェック係（タスク musu_sos）が動いていない可能性があります。");
};
</script>
</body>
</html>
