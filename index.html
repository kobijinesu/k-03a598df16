<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#105e3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="musu競馬">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>musu 競馬予想</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#16201b;--sub:#5d6b64;--line:#e2e8e5;--accent:#105e3e;--accent2:#e6f2ec;--buy:#c2410c;--buybg:#fff1e8;--hit:#15803d;--miss:#9aa5a0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1412;--card:#18201c;--text:#e8efeb;--sub:#97a69e;--line:#26302b;--accent:#3fbf86;--accent2:#1b2c24;--buy:#fb923c;--buybg:#2a1d14;--hit:#4ade80;--miss:#6b7770}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:17px;font-weight:700}
header .meta{font-size:12px;opacity:.85;margin-top:2px}
.sosb{margin-left:auto;border:1px solid #fff !important;background:#b91c1c !important;color:#fff !important;font-weight:700}
#sos{margin:10px 16px 0;padding:12px;border-radius:12px;background:var(--card);border:2px solid #b91c1c;font-size:14px;line-height:1.5}
#sos .it{padding:6px 0;border-top:1px solid var(--line)}#sos .ng{color:#b91c1c;font-weight:700}#sos .ok{color:var(--hit)}#sos .x{float:right;border:0;background:none;color:var(--sub);font-size:18px}
.src{display:flex;gap:6px;margin-top:6px}.src button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px}.src button.on{background:#fff;color:var(--accent);font-weight:700}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.race-title{font-size:20px;font-weight:800;margin:0}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.count{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);white-space:nowrap}
.badge.buy{background:var(--buybg);color:var(--buy)}
.badge.hit{background:var(--hit);color:#fff}
.badge.miss{background:transparent;color:var(--miss);border:1px solid var(--line)}
.buy-box{background:var(--buybg);border-radius:12px;padding:12px;margin-top:12px}
.buy-box h3{margin:0 0 8px;font-size:14px;color:var(--buy)}
.horse{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.horse:first-of-type{border-top:0}
.num{flex:0 0 40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}
.buy-box .num{background:var(--buy)}
.hname{font-size:17px;font-weight:700}
.right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:800}
.none{padding:14px;text-align:center;color:var(--sub);background:var(--accent2);border-radius:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
th{color:var(--sub);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font-size:15px;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.rrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rno{flex:0 0 44px;font-size:18px;font-weight:800}
.rmid{flex:1;min-width:0}
.rmid .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:var(--accent2);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.sample{background:#fde68a;color:#713f12;font-size:12px;font-weight:700;padding:6px 16px}
</style>
</head>
<body>
<header><h1>musu 競馬予想</h1><div class="meta" id="meta">読み込み中…</div><div class="src"><button data-src="jra">中央</button><button data-src="nar">地方（検証中）</button><button class="sosb" id="sosb">🆘 緊急チェック</button></div></header>
<div id="sos" hidden></div>
<div class="sample" id="sample" hidden></div>
<main id="view"></main>
<nav>
  <button data-tab="next" class="on"><span class="ic">⏱</span>次のレース</button>
  <button data-tab="today"><span class="ic">📋</span>今日のレース</button>
  <button data-tab="result"><span class="ic">📊</span>結果</button>
</nav>
<script>
let D = null, H = [], tab = localStorage.getItem("tab") || "next", venue = null, src = localStorage.getItem("src") || "jra";
const lbl = () => D.decision_label || `締切${D.decision_min}分前`;
const $ = s => document.querySelector(s);
const yen = v => (v ?? 0).toLocaleString("ja-JP") + "円";
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function now() { return D && D.now_override ? new Date(D.now_override) : new Date(); }
function t(hm) { const [h, m] = hm.split(":").map(Number); const d = new Date(D.date + "T00:00:00+09:00"); d.setHours(h, m, 0, 0); return d; }

// 単勝の型の切り替え（1=合格版、2=拡大版、3=広め。2・3は検証中）。中央のみ
let modeSel = "1", mode = "1";   // modeSel=選んだ型、mode=今の表示に使う型（地方は常に合格版の扱い）
try { modeSel = localStorage.getItem("mode") || "1"; } catch {}
const MODES = { "1": "合格版", "2": "拡大版", "3": "広め" };
const TIERTAG = { 2: "拡大", 3: "広め" };
function buysOf(r) { return mode === "1" || !r.buys_ext ? r.buys : r.buys.concat(r.buys_ext.filter(b => b.tier <= +mode)); }
function retOf(r) { return mode === "1" || !r.ext_res ? r.result.ret : r.ext_res[mode].ret; }
function modeBar() {
  if (src !== "jra") return "";
  return `<div class="chips">${Object.entries(MODES).map(([k, v]) => `<button data-mode="${k}" class="${k === mode ? "on" : ""}">${v}${k === "1" ? "" : "（検証中）"}</button>`).join("")}</div>`;
}

function status(r) {
  if (r.state === "out") return ["対象外", "miss"];
  const bs = buysOf(r);
  if (r.result && r.state === "decided") return bs.length ? (retOf(r) > 0 ? ["的中", "hit"] : ["外れ", "miss"]) : ["見送り", "miss"];
  if (r.state === "missed") return ["予想なし", "miss"];
  if (r.state === "decided") return bs.length ? [`買い ${bs.length}頭`, "buy"] : ["見送り", ""];
  return ["予想前", ""];
}

function axisBox(r) {
  // 単勝の買い馬（選択中の型）を軸にした3連複・3連単（検証中）
  const list = (r.axis || {})[mode] || [], res = (r.axis_res || {})[mode];
  if (!list.length) return "";
  const hit = new Set(res ? res.hits : []);
  return `<div style="margin-top:10px;padding:10px;border:1px solid var(--line,#ccc);border-radius:10px">
    <div class="row between"><b>🧲 単勝の馬を1着にした3連単（検証中）</b>${res ? `<span class="badge ${res.ret ? "hit" : "miss"}">${res.ret ? "的中 " + yen(res.ret) : "外れ"}</span>` : ""}</div>
    <table><tr><th>組番</th><th>今のオッズ</th><th>期待値</th></tr>${list.map(e => `<tr><td>${hit.has(e.type + e.kumi) ? "🎯 " : ""}${esc(e.kumi)}</td><td>${e.odds ? e.odds.toFixed(1) : "—"}</td><td>${e.ev.toFixed(2)}</td></tr>`).join("")}</table>
    <div class="note">各100円・合計${yen(100 * list.length)}（単勝より少なめの額で）。${mode === "1" ? "合格版" : "拡大版まで"}の馬を1着に固定し、2・3着は勝率モデルと「2・3着の来やすさ」の補正から期待値1.2以上の組を5点まで。過去の試算は 139%／149%（拡大版まで、2023-24／2025-26）だが、約70点に1回しか当たらず、数回の大当たりで稼ぐ形（大当たり3回を除くと約95%）。長い外れが続くのが普通です。</div></div>`;
}

function horseRows(list, withEv) {
  return list.map(h => `<div class="horse"><div class="num">${h.no}</div>
    <div><div class="hname">${h.tier ? `<span class="badge">${TIERTAG[h.tier]}</span> ` : ""}${esc(h.name)}</div><div class="sub">勝率 ${pct(h.p)}${withEv ? ` ・ 期待値 ${h.ev.toFixed(2)}` : ` ・ 必要オッズ ${h.need.toFixed(1)}倍`}</div></div>
    <div class="right"><div class="big">${h.odds.toFixed(1)}<span class="sub">倍</span></div></div></div>`).join("");
}

function oshiBox(r) {
  // 🔮 推し: 4番人気以下で3着以内に来ると読んだ馬（1レース1頭・検証中）
  const o = r.oshi; if (!o) return "";
  const res = r.oshi_res;
  const badge = res ? (res.win ? `<span class="badge hit">1着！</span>` : res.hit ? `<span class="badge hit">的中（3着以内）</span>` : `<span class="badge miss">外れ</span>`) : "";
  return `<div style="margin:8px 0 10px;padding:12px;border-radius:12px;background:var(--accent2)">
    <div class="row between"><b>🔮 推し ${o.strong ? "★★" : "★"}</b>${badge}</div>
    <div style="font-size:18px;font-weight:700;margin:6px 0">${o.no}番 ${esc(o.name)} <span class="sub">${o.ninki}番人気・${o.odds.toFixed(1)}倍</span></div>
    <div>この馬は<b>3着以内に来る</b>と読みます（モデルの見立て ${pct(o.t3)}、単勝オッズから見た世間の見立て ${pct(o.t3m)}）${o.p >= 0.15 ? "。1着まであるかも" : ""}</div>
    ${o.why && o.why.length ? `<div class="note" style="margin-top:6px">理由：${o.why.map(esc).join("／")}</div>` : ""}
  </div>`;
}

function paceBox(r) {
  // 🎬 展開予想（検証中）: ペース・馬場の内外・荒れ度の世界を混ぜた計算（10万回シミュレーションを無限回まわしたのと同じ）
  const v = r.pace; if (!v) return "";
  const res = r.pace_res, lab = { high: "ハイペースなら", slow: "スローなら", inner: "内が伸びる馬場なら", outer: "外が伸びる馬場なら", chaos: "荒れるなら", calm: "堅く決まるなら" };
  const sc = ["high", "slow", "inner", "outer", "chaos"].filter(k => v.scen[k] && v.scen[k].diff > 0.02)
    .map(k => `<li>${lab[k]}：<b>${v.scen[k].no}番 ${esc(v.scen[k].name)}</b>（3着以内 ${pct(v.scen[k].t3)}、ふだんより +${(v.scen[k].diff * 100).toFixed(0)}pt）</li>`).join("");
  const tri = v.trifecta[0], trio = v.trio[0];
  const hit = res ? (res.tri_rank ? `<span class="badge hit">3連単 的中！</span>` : res.trio_rank ? `<span class="badge hit">3連複 的中（${res.trio_rank}番目）</span>` : `<span class="badge miss">決着 ${esc(res.trio)}</span>`) : "";
  return `<details style="margin-top:8px"><summary class="sub">▼ 🎬 展開予想 ${hit}</summary>
    <div style="padding:6px 2px">
      ${v.front && v.front.length ? `<div>前に行きそう：${v.front.map(h => `${h.no}番 ${esc(h.name)}`).join("・")}　／　後ろから：${v.back.map(h => `${h.no}番`).join("・")}</div>` : ""}
      <div style="margin-top:6px">いちばん起きやすい決着：<b>3連単 ${esc(tri.kumi)}</b>（10万回なら約${Math.round(tri.p * 100000).toLocaleString()}回）、<b>3連複 ${esc(trio.kumi)}</b>（約${Math.round(trio.p * 100000).toLocaleString()}回）</div>
      ${sc ? `<ul style="margin:6px 0 0 18px;padding:0">${sc}</ul>` : ""}
      <div class="note">ペース・馬場の内外・荒れ具合で「まとめて動く」ことを入れて全通りを計算（10万回のシミュレーションを無限回まわしたのと同じ）。過去の確認で、今の計算より1〜3着の当たり方がわずかに良い。</div>
    </div></details>`;
}

function asobiBox(r) {
  // お楽しみ馬券（遊び用・別帳簿）。単勝モデルとは別枠
  const res = r.asobi_res, hit = new Set(res ? res.hits : []);
  let h = `<div style="margin-top:10px;padding:10px;border:1px dashed var(--line,#ccc);border-radius:10px">
    <div class="row between"><b>🎉 お楽しみ馬券（遊び用）</b>${res ? `<span class="badge ${res.hits.length ? "hit" : "miss"}">${res.hits.length ? "的中 " + yen(res.ret) : "外れ"}</span>` : ""}</div>`;
  if (!r.asobi.length) return h + `<div class="sub">このレースは条件に合う組なし（お休み）</div></div>`;
  h += `<table><tr><th>券種</th><th>組番</th><th>オッズ</th></tr>${r.asobi.map(e => `<tr><td>${esc(e.type)}</td><td>${hit.has(e.kumi) ? "🎯 " : ""}${esc(e.kumi)}</td><td>${e.odds.toFixed(1)}</td></tr>`).join("")}</table>
    <div class="note">各100円・合計${yen(100 * r.asobi.length)}。オッズ30〜100倍で、勝率モデルから見て期待値の高い組（3連複8点・3連単5点まで）。過去の試算の回収率は3連複で約8割、3連単で約10割。勝てると確認された買い方ではないので、遊ぶ金額を決めて楽しむ用です。</div></div>`;
  return h;
}

function raceDetail(r) {
  const [s, cls] = status(r);
  let html = `<div class="row between"><div><p class="race-title">${esc(r.venue)} ${r.R}R</p>
    <div class="sub">${[r.name ? esc(r.name) : "", `発走 ${r.post}`, `締切 ${r.close}`].filter(Boolean).join(" ・ ")}</div></div><span class="badge ${cls}">${s}</span></div>`;
  if (r.state === "out" || r.state === "missed") {
    html += `<div class="none">${esc(r.note || "予想の対象外")}</div>`;
  } else if (r.state === "decided" || r.result) {
    html += oshiBox(r);
    html += paceBox(r);
    const bs = buysOf(r);
    html += bs.length
      ? `<div class="buy-box"><h3>単勝で買う（各100円${mode === "1" ? "" : "・" + MODES[mode] + "を含む"}）</h3>${horseRows(bs, true)}</div>`
      : `<div class="none">${r.note ? "予想できませんでした（" + esc(r.note) + "）" : "このレースは見送り（条件に合う馬なし）"}</div>`;
    html += axisBox(r);
    if (r.asobi) html += asobiBox(r);
    if (r.top && r.top.length) html += `<details style="margin-top:10px"><summary class="sub">▼ 勝率の高い順（参考）</summary>${horseRows(r.top, false)}</details>`;
    if (r.exo && r.exo.length) html += `<details style="margin-top:6px"><summary class="sub">▼ 参考：組合せ馬券（検証中・成績は未確認）</summary>
      <table><tr><th>券種</th><th>組番</th><th>オッズ</th><th>期待値</th></tr>${r.exo.map(e => `<tr><td>${esc(e.type)}</td><td>${esc(e.kumi)}</td><td>${e.odds.toFixed(1)}</td><td>${e.ev.toFixed(2)}</td></tr>`).join("")}</table>
      <div class="note">単勝モデルの勝率から計算した組合せの確率 × 判定時のオッズ（ワイドは下限）。期待値1.3以上の上位3組まで（ワイド100倍・3連複500倍・3連単3000倍以下）。過去の検証では基準に届いていないため、記録用の参考です。</div></details>`;
    html += `<div class="note">${D.rule_note ? esc(D.rule_note) : `オッズは判定時（締切${D.decision_min}分前）の値。買う条件: 単勝10〜50倍 かつ 期待値1.15以上。`}</div>`;
  } else {
    html += `<div class="none">予想は ${lbl()}（${r.decide}ごろ）に出ます</div>`;
  }
  if (r.result) {
    html += `<div class="note">結果: 1着 ${r.result.first.join("・")}番 ${esc(r.result.first_name || "")}　単勝 ${yen(r.result.tan)}${r.buys.length ? ` ／ このレースの収支 ${yen(r.result.ret - r.result.bet)}` : ""}</div>`;
  }
  return html;
}

function viewNext() {
  const n = now();
  const up = D.races.filter(r => r.state !== "out" && t(r.post) > n).sort((a, b) => t(a.post) - t(b.post));
  if (!up.length) return `<div class="card"><p class="race-title">本日のレースは終了しました</p><div class="sub">結果は「結果」タブで見られます。</div></div>`;
  const r = up[0], cl = t(r.close), left = Math.max(0, Math.floor((cl - n) / 1000));
  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  let html = `<div class="card"><div class="row between"><span class="sub">締切まで</span><span class="count" id="cd" data-close="${cl.toISOString()}">${mm}:${ss}</span></div></div>`;
  html += `<div class="card">${raceDetail(r)}</div>`;
  const after = up.slice(1, 4);
  if (after.length) html += `<div class="card"><div class="sub" style="margin-bottom:4px">このあとのレース</div>${after.map(rowHtml).join("")}</div>`;
  return html;
}

function rowHtml(r) {
  const [s, cls] = status(r);
  return `<details class="rrow-wrap"><summary class="rrow"><div class="rno">${r.R}R</div>
    <div class="rmid"><div class="n">${r.oshi ? (r.oshi_res ? (r.oshi_res.hit ? "🔮✅ " : "🔮 ") : "🔮 ") : ""}${esc(r.venue)} ${esc(r.name || "")}</div><div class="sub">発走 ${r.post}</div></div>
    <span class="badge ${cls}">${s}</span></summary><div style="padding:4px 0 12px">${raceDetail(r)}</div></details>`;
}

function viewToday() {
  const venues = [...new Set(D.races.map(r => r.venue))];
  if (!venue || !venues.includes(venue)) venue = venues[0];
  const chips = `<div class="chips">${venues.map(v => `<button data-v="${esc(v)}" class="${v === venue ? "on" : ""}">${esc(v)}</button>`).join("")}</div>`;
  const list = D.races.filter(r => r.venue === venue).sort((a, b) => a.R - b.R);
  return chips + `<div class="card">${list.map(rowHtml).join("")}</div>`;
}

function viewResult() {
  const done = D.races.filter(r => r.result && r.state === "decided");
  const bets = done.filter(r => buysOf(r).length);
  const spent = bets.reduce((a, r) => a + 100 * buysOf(r).length, 0), ret = bets.reduce((a, r) => a + retOf(r), 0);
  const hits = bets.filter(r => retOf(r) > 0).length;
  let html = `<div class="card"><div class="sub" style="margin-bottom:8px">今日 ${D.date_ja} の${src === "jra" ? `単勝（${MODES[mode]}）の` : ""}成績　確定 ${done.length}/${D.races.length}レース</div>
    <div class="kpi"><div><b>${spent ? ((ret / spent) * 100).toFixed(0) + "%" : "—"}</b><span>回収率</span></div>
    <div><b>${yen(ret - spent)}</b><span>収支</span></div>
    <div><b>${hits}/${bets.length}</b><span>的中/買ったレース</span></div>
    <div><b>${yen(spent)}</b><span>投資（各100円）</span></div></div></div>`;
  html += `<div class="card"><table><tr><th>レース</th><th>買い</th><th>1着</th><th>払戻</th></tr>${done.map(r =>
    `<tr><td>${esc(r.venue)}${r.R}R</td><td>${buysOf(r).map(b => b.no).join("・") || "—"}</td><td>${r.result.first.join("・")}</td><td>${buysOf(r).length ? (retOf(r) ? `<b style="color:var(--hit)">${yen(retOf(r))}</b>` : "0円") : "—"}</td></tr>`).join("")}</table></div>`;
  const xd = D.races.filter(r => r.axis_res && r.axis_res[mode] && r.axis_res[mode].bet);
  if (xd.length) {
    const xs = xd.reduce((a, r) => a + r.axis_res[mode].bet, 0), xr = xd.reduce((a, r) => a + r.axis_res[mode].ret, 0);
    html += `<div class="card"><div class="sub" style="margin-bottom:8px">🧲 単勝の馬から3連複・3連単（${MODES[mode]}が軸・検証中）今日</div>
      <div class="kpi"><div><b>${((xr / xs) * 100).toFixed(0)}%</b><span>回収率</span></div><div><b>${yen(xr - xs)}</b><span>収支</span></div>
      <div><b>${xd.filter(r => r.axis_res[mode].ret).length}/${xd.length}</b><span>的中/買ったレース</span></div><div><b>${yen(xs)}</b><span>投資</span></div></div></div>`;
  }
  const HX = H.filter(h => h.axis && h.axis[mode] && h.axis[mode].spent), HE = H.filter(h => h.ext && h.ext[mode] && h.ext[mode].spent);
  if (mode !== "1" && HE.length) {
    const s = HE.reduce((a, h) => a + h.ext[mode].spent, 0), r_ = HE.reduce((a, h) => a + h.ext[mode].ret, 0);
    html += `<div class="card"><div class="sub">単勝（${MODES[mode]}）の通算（${HE.length}日）</div><div class="kpi"><div><b>${((r_ / s) * 100).toFixed(0)}%</b><span>回収率</span></div><div><b>${yen(r_ - s)}</b><span>収支</span></div></div></div>`;
  }
  if (HX.length) {
    const s = HX.reduce((a, h) => a + h.axis[mode].spent, 0), r_ = HX.reduce((a, h) => a + h.axis[mode].ret, 0);
    html += `<div class="card"><div class="sub">🧲 3連複・3連単（${MODES[mode]}が軸）の通算（${HX.length}日）</div><div class="kpi"><div><b>${((r_ / s) * 100).toFixed(0)}%</b><span>回収率</span></div><div><b>${yen(r_ - s)}</b><span>収支</span></div></div></div>`;
  }
  const od = D.races.filter(r => r.oshi_res);
  if (od.length || D.races.some(r => r.oshi)) {
    const oh = od.filter(r => r.oshi_res.hit).length, ow = od.filter(r => r.oshi_res.win).length;
    const HO = H.filter(h => h.oshi && h.oshi.n), on = HO.reduce((a, h) => a + h.oshi.n, 0), ohh = HO.reduce((a, h) => a + h.oshi.hit, 0);
    html += `<div class="card"><div class="sub" style="margin-bottom:8px">🔮 推し（人気薄が3着以内に来るか）今日</div>
      <div class="kpi"><div><b>${oh}/${od.length}</b><span>3着以内に来た</span></div><div><b>${ow}</b><span>うち1着</span></div></div>
      <table style="margin-top:8px"><tr><th>レース</th><th>推し</th><th>結果</th></tr>${od.map(r => `<tr><td>${esc(r.venue)}${r.R}R</td><td>${r.oshi.no}番（${r.oshi.ninki}番人気）</td><td>${r.oshi_res.win ? "<b style='color:var(--hit)'>1着</b>" : r.oshi_res.hit ? "<b style='color:var(--hit)'>3着以内</b>" : "—"}</td></tr>`).join("")}</table>
      ${on ? `<div class="note">通算 ${ohh}/${on}（${((ohh / on) * 100).toFixed(0)}%）。過去の試算では約半分が3着以内。</div>` : ""}</div>`;
  }
  const ad = D.races.filter(r => r.asobi_res);
  if (ad.length) {
    const as = ad.reduce((a, r) => a + r.asobi_res.bet, 0), ar = ad.reduce((a, r) => a + r.asobi_res.ret, 0), ah = ad.filter(r => r.asobi_res.hits.length).length;
    html += `<div class="card"><div class="sub" style="margin-bottom:8px">🎉 お楽しみ馬券（遊び用・別帳簿）今日</div>
      <div class="kpi"><div><b>${as ? ((ar / as) * 100).toFixed(0) + "%" : "—"}</b><span>回収率</span></div><div><b>${yen(ar - as)}</b><span>収支</span></div>
      <div><b>${ah}/${ad.length}</b><span>的中/買ったレース</span></div><div><b>${yen(as)}</b><span>投資</span></div></div>
      <table style="margin-top:8px"><tr><th>レース</th><th>点数</th><th>払戻</th></tr>${ad.map(r => `<tr><td>${esc(r.venue)}${r.R}R</td><td>${r.asobi.length}</td><td>${r.asobi_res.ret ? `<b style="color:var(--hit)">${yen(r.asobi_res.ret)}</b>` : "0円"}</td></tr>`).join("")}</table></div>`;
  }
  const HA = H.filter(h => h.a_spent);
  if (HA.length) {
    const sa = HA.reduce((a, h) => a + h.a_spent, 0), ra_ = HA.reduce((a, h) => a + h.a_ret, 0);
    html += `<div class="card"><div class="sub">🎉 お楽しみ馬券の通算（${HA.length}日）</div><div class="kpi"><div><b>${((ra_ / sa) * 100).toFixed(0)}%</b><span>回収率</span></div><div><b>${yen(ra_ - sa)}</b><span>収支</span></div></div></div>`;
  }
  if (H.length) {
    const S = H.reduce((a, h) => ({ spent: a.spent + h.spent, ret: a.ret + h.ret, bets: a.bets + h.bets, hits: a.hits + h.hits }), { spent: 0, ret: 0, bets: 0, hits: 0 });
    html += `<div class="card"><div class="sub" style="margin-bottom:8px">これまでの通算（${H.length}日）</div>
      <div class="kpi"><div><b>${S.spent ? ((S.ret / S.spent) * 100).toFixed(0) + "%" : "—"}</b><span>回収率</span></div><div><b>${yen(S.ret - S.spent)}</b><span>収支</span></div></div>
      <table style="margin-top:8px"><tr><th>日付</th><th>買い</th><th>的中</th><th>回収率</th></tr>${[...H].reverse().map(h =>
        `<tr><td>${esc(h.date_ja)}</td><td>${h.bets}</td><td>${h.hits}</td><td>${h.spent ? ((h.ret / h.spent) * 100).toFixed(0) + "%" : "—"}</td></tr>`).join("")}</table></div>`;
  }
  return html;
}

function render() {
  if (!D) return;
  mode = src === "jra" ? modeSel : "1";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const open = [...document.querySelectorAll("details[open] summary .rno")].map(e => e.textContent);
  $("#view").innerHTML = modeBar() + (tab === "next" ? viewNext() : tab === "today" ? viewToday() : viewResult());
  document.querySelectorAll(".chips button[data-v]").forEach(b => b.onclick = () => { venue = b.dataset.v; render(); });
  document.querySelectorAll(".chips button[data-mode]").forEach(b => b.onclick = () => { modeSel = b.dataset.mode; try { localStorage.setItem("mode", modeSel); } catch {} render(); });
  document.querySelectorAll("details").forEach(d => { const k = d.querySelector(".rno"); if (k && open.includes(k.textContent)) d.open = true; });
}

async function load() {
  try {
    const q = "?t=" + Date.now();
    const DEMO = new URLSearchParams(location.search).has("demo");   // ?demo=1 のときは過去の再現（data/demo_*.json）を表示
    const pre = (DEMO ? "demo_" : "") + (src === "nar" ? "nar_" : "");
    D = await (await fetch(`data/${pre}today.json` + q, { cache: "no-store" })).json();
    try { H = await (await fetch(`data/${pre}history.json` + q, { cache: "no-store" })).json(); } catch { H = []; }
    document.querySelectorAll(".src button").forEach(b => b.classList.toggle("on", b.dataset.src === src));
    const age = (Date.now() - new Date(D.generated.replace(" ", "T") + ":00+09:00")) / 60000;   // 予想係は動いている間10分おきに更新する
    const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    const stale = D.date === today && age > 20 && (new Date().getUTCHours() + 9) % 24 < (src === "nar" ? 22 : 18);
    $("#meta").textContent = `${D.date_ja} ・ 更新 ${D.generated.slice(11, 16)} ・ 判定 ${lbl()}` + (stale ? ` ・ ⚠ ${Math.round(age)}分間更新なし` : "");
    $("#meta").style.color = stale ? "#d33" : "";
    const s = $("#sample"); s.hidden = !D.sample; s.textContent = D.sample || "";
    render();
  } catch (e) { $("#meta").textContent = src === "nar" ? "地方のデータはまだありません" : "データを読み込めませんでした（電波を確認）"; document.querySelectorAll(".src button").forEach(b => b.classList.toggle("on", b.dataset.src === src)); if (src === "nar") { D = null; $("#view").innerHTML = ""; } }
}
document.querySelectorAll(".src button").forEach(b => b.onclick = () => { src = b.dataset.src; localStorage.setItem("src", src); venue = null; load(); });
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; localStorage.setItem("tab", tab); render(); window.scrollTo(0, 0); });
setInterval(() => { const c = $("#cd"); if (c) { const left = Math.max(0, Math.floor((new Date(c.dataset.close) - now()) / 1000)); c.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); } }, 1000);
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
// 緊急チェック: 中継サービス ntfy.sh の合言葉チャンネルに合図 → PC の緊急チェック係（code\musu_sos.py）が点検・修正し data/sos.json に結果を出す
const SOS_TOPIC = "musu-sos-6f1873a77b020c2b";
function sosShow(h) { const b = $("#sos"); b.hidden = false; b.innerHTML = `<button class="x" onclick="$('#sos').hidden=true">×</button>` + h; }
function sosRes(j) {
  const head = j.phase === "fixing" ? "🔧 直しています…" : j.ok ? "✅ 正常に動いています" : "⚠ 直りきっていません";
  return `<b>${head}</b>${j.note ? `<div>${j.note}</div>` : ""}<div class="sub">点検 ${j.checked.slice(11, 16)}</div>` +
    j.items.map(x => `<div class="it"><span class="${x.ok ? "ok" : "ng"}">${x.ok ? "○" : "×"} ${x.name}</span>：${x.msg}${x.fix ? `<br>→ ${x.fix}` : ""}</div>`).join("");
}
$("#sosb").onclick = async () => {
  if (!confirm("PC に緊急チェックを頼みますか？（点検して、直るところまで直します）")) return;
  const t0 = Date.now();
  try { await fetch(`https://ntfy.sh/${SOS_TOPIC}`, { method: "POST", body: "check" }); }
  catch { sosShow("合図を送れませんでした（電波を確認）"); return; }
  sosShow("PC に合図を送りました。点検中です（1〜3分）…");
  for (let i = 0; i < 60; i++) {   // 直して確かめるのを最大3回くり返すので、最長15分ほど待つ
    await new Promise(r => setTimeout(r, 15000));
    try {
      const j = await (await fetch("data/sos.json?t=" + Date.now(), { cache: "no-store" })).json();
      if (new Date(j.asked + "+09:00") >= t0 - 60000) { sosShow(sosRes(j)); if (j.phase !== "fixing") { load(); return; } continue; }
    } catch {}
    sosShow(`PC に合図を送りました。点検中です…（${Math.round((Date.now() - t0) / 60000)}分経過）`);
  }
  sosShow("PC から返事がありません。PC の電源・ネット接続か、緊急チェック係（タスク musu_sos）が動いていない可能性があります。");
};
</script>
